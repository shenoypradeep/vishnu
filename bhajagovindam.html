<!DOCTYPE html>
<html lang="sa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bhaja Govindam · Vedic Space</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Sanskrit:ital@0;1&family=Noto+Serif+Devanagari:wght@400;600&family=Noto+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2b2420; --soft:#6f655c; --faint:#a1968b; --line:#e7dfd4; --paper:#fdfaf5; --card:#fffdf9;
  --accent:#9a4a1c; --accent-soft:#f5e6d8; --on:#9a4a1c; --off:#d8cfc4;
  --deva:"Tiro Devanagari Sanskrit","Noto Serif Devanagari",serif;
  --latin:"Noto Serif",Georgia,serif;
}
@media (prefers-color-scheme:dark){
  :root{--ink:#ece4da;--soft:#b8ab9d;--faint:#85796d;--line:#3a332d;--paper:#1c1916;--card:#231f1b;
        --accent:#e09a6a;--accent-soft:#3a2a1f;--on:#e09a6a;--off:#4a423a;}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--latin);}
body{font-size:16px;line-height:1.55}
.wrap{max-width:820px;margin:0 auto;padding:0 20px 64px}
header{text-align:center;padding:40px 0 18px}
header .deva-title{font-family:var(--deva);font-size:2.6rem;line-height:1.3;margin:0}
header .iast-title{font-style:italic;color:var(--soft);margin:4px 0 0;font-size:1.05rem}
header .en-title{margin:2px 0 0;font-size:.95rem;color:var(--soft)}
header .author{margin:10px 0 0;font-size:.9rem;color:var(--soft)}
.badge{display:inline-block;margin-top:12px;font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;
  color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:3px 10px}
.about{font-size:.88rem;color:var(--soft);text-align:center;max-width:620px;margin:10px auto 0}

.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--paper) 92%,transparent);
  backdrop-filter:blur(6px);border-bottom:1px solid var(--line);margin:18px -20px 0;padding:10px 20px;
  display:flex;gap:22px;justify-content:center;flex-wrap:wrap}
.sw{display:inline-flex;align-items:center;gap:8px;font-size:.86rem;color:var(--soft);cursor:pointer;
  user-select:none;background:none;border:0;padding:2px 0;font-family:inherit}
.sw .k{width:28px;height:16px;border-radius:999px;background:var(--off);position:relative;transition:background .15s}
.sw .k::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;
  background:#fff;transition:transform .15s}
.sw[aria-pressed="true"]{color:var(--ink)}
.sw[aria-pressed="true"] .k{background:var(--on)}
.sw[aria-pressed="true"] .k::after{transform:translateX(12px)}
.sw.mini{font-size:.76rem;gap:6px}
.sw.mini .k{width:22px;height:13px}
.sw.mini .k::after{width:9px;height:9px}
.sw.mini[aria-pressed="true"] .k::after{transform:translateX(9px)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;font-size:.74rem}
.seg button{border:0;background:none;color:var(--faint);padding:1px 9px;cursor:pointer;font-family:inherit}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.seg button.dv{font-family:var(--deva);font-size:.86rem}

.section{text-align:center;margin:44px 0 6px}
.section .sd{font-family:var(--deva);font-size:1.35rem;color:var(--accent)}
.section .si{font-size:.82rem;color:var(--soft);font-style:italic}
.section::after{content:"";display:block;width:60px;height:1px;background:var(--line);margin:12px auto 0}

.verse{padding:30px 0 26px;border-bottom:1px solid var(--line)}
.verse:last-child{border-bottom:0}
.vhead{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;min-height:1px}
.tag{font-size:.72rem;color:var(--soft);border:1px solid var(--line);border-radius:999px;padding:1px 9px}
.sa{font-family:var(--deva);font-size:1.62rem;line-height:1.75;text-align:center;white-space:pre-line}
.iast{font-style:italic;color:var(--soft);text-align:center;white-space:pre-line;margin-top:10px;font-size:1.02rem;line-height:1.6}
.blk{margin-top:22px}
.lbl{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
.lbl .ctl{display:flex;align-items:center;gap:14px;text-transform:none;letter-spacing:0}
.pd-d{font-family:var(--deva);font-size:1.18rem;line-height:1.7}
.pd-i{font-style:italic;color:var(--soft);font-size:.95rem;margin-top:2px}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.w{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.w .wd{font-family:var(--deva);font-size:1.15rem;line-height:1.4}
.w .wi{font-style:italic;color:var(--soft);font-size:.84rem}
.w .wm{font-size:.9rem;margin-top:3px}
.w .wg{font-size:.76rem;color:var(--faint);margin-top:5px;border-top:1px dashed var(--line);padding-top:4px}
.w .wg .gd{font-family:var(--deva);font-size:.86rem}
.tr{margin-top:22px;font-size:1.04rem;line-height:1.65}
.notes{margin-top:12px;font-size:.8rem;color:var(--soft)}
.notes p{margin:3px 0}
.notes b{font-weight:600;color:var(--faint)}

body:not(.show-iast) .iast, body:not(.show-iast) .pd-i, body:not(.show-iast) .w .wi{display:none}
body:not(.show-pd) .pd{display:none}
body:not(.show-wbw) .wbw{display:none}
body:not(.show-lg) .w .wg{display:none}
body.lg-iast .w .gd{display:none}
body:not(.lg-iast) .w .gi{display:none}

footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);font-size:.8rem;color:var(--soft)}
footer p{margin:4px 0}
@media (max-width:560px){
  header .deva-title{font-size:2.1rem}.sa{font-size:1.38rem}.bar{gap:16px}
  .words{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
}
</style>
</head>

morning, winter and spring come round again and again. Time plays, life ebbs away, yet the wind of desire never lets go.","notes":[],"by":null,"var":[],"x":false},{"n":"13","d":"का ते कान्ता धनगतचिन्ता\nवातुल किं तव नास्ति नियन्ता ।\nत्रिजगति सज्जनसङ्गतिरेका\nभवति भवार्णवतरणे नौका ॥ १३ ॥","i":"kā te kāntā dhanagatacintā\nvātula kiṃ tava nāsti niyantā |\ntrijagati sajjanasaṅgatirekā\nbhavati bhavārṇavataraṇe naukā || 13 ||","pd":"का ते कान्ता-धन-गत-चिन्ता वातुल किम् तव न अस्ति नियन्ता त्रि-जगति सत्-जन-सङ्गतिः एका भवति भव-अर्णव-तरणे नौका","pi":"kā te kāntā-dhana-gata-cintā vātula kim tava na asti niyantā tri-jagati sat-jana-saṅgatiḥ ekā bhavati bhava-arṇava-taraṇe naukā","w":[["का","kā","why this","किम्","kim","सर्वनाम, प्रथमा, स्त्री, एक","sarvanāma, prathamā, strī, eka","pronoun f. nom. sg."],["ते","te","your","युष्मद्","yuṣmad","सर्वनाम, षष्ठी, एक","sarvanāma, ṣaṣṭhī, eka","pronoun gen. sg."],["कान्ता-धन-गत-चिन्ता","kāntā-dhana-gata-cintā","worry about wife and wealth","कान्ताधनगतचिन्ता","kāntādhanagatacintā","प्रथमा, स्त्री, एक","prathamā, strī, eka","f. nom. sg."],["वातुल","vātula","O distracted one","वातुल","vātula","सम्बोधन, पुं, एक","sambodhana, puṃ, eka","m. voc. sg."],["किम्","kim","is it that","किम्","kim","अव्यय","avyaya","indeclinable"],["तव","tava","for you","युष्मद्","yuṣmad","सर्वनाम, षष्ठी, एक","sarvanāma, ṣaṣṭhī, eka","pronoun gen. sg."],["न","na","not","न","na","अव्यय","avyaya","indeclinable"],["अस्ति","asti","there is","अस्","as","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg."],["नियन्ता","niyantā","a guide","नियन्तृ","niyantṛ","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg."],["त्रि-जगति","tri-jagati","in the three worlds","त्रिजगत्","trijagat","सप्तमी, नपुं, एक","saptamī, napuṃ, eka","n. loc. sg."],["सत्-जन-सङ्गतिः","sat-jana-saṅgatiḥ","the company of the good","सज्जनसङ्गति","sajjanasaṅgati","प्रथमा, स्त्री, एक","prathamā, strī, eka","f. nom. sg."],["एका","ekā","alone","एक","eka","प्रथमा, स्त्री, एक","prathamā, strī, eka","f. nom. sg."],["भवति","bhavati","is","भू","bhū","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg."],["भव-अर्णव-तरणे","bhava-arṇava-taraṇe","for crossing the ocean of birth and death","भवार्णवतरण","bhavārṇavataraṇa","सप्तमी, नपुं, एक","saptamī, napuṃ, eka","n. loc. sg."],["नौका","naukā","the boat","नौका","naukā","प्रथमा, स्त्री, एक","prathamā, strī, eka","f. nom. sg."]],"t":"Why this worry about wife and wealth, O distracted one? Have you no one to guide you? In all three worlds, the company of the good alone is the boat for crossing the ocean of birth and death.","notes":["The source writes kāntā dhanagatacintā as two words; it is read here as one compound, kāntādhanagatacintā."],"by":null,"var":[],"x":false},{"n":"13a","d":"द्वादशमञ्जरिकाभिरशेषः\nकथितो वैयाकरणस्यैषः ।\nउपदेशोऽभूद्विद्यानिपुणैः\nश्रीमच्छङ्करभगवच्चरणैः ॥ १३अ ॥","i":"dvādaśamañjarikābhiraśeṣaḥ\nkathito vaiyākaraṇasyaiṣaḥ |\nupadeśo'bhūdvidyānipuṇaiḥ\nśrīmacchaṅkarabhagavaccaraṇaiḥ || 13a ||","pd":"द्वादश-मञ्जरिकाभिः अशेषः कथितः वैयाकरणस्य एषः उपदेशः अभूत् विद्या-निपुणैः श्रीमत्-शङ्कर-भगवत्-चरणैः","pi":"dvādaśa-mañjarikābhiḥ aśeṣaḥ kathitaḥ vaiyākaraṇasya eṣaḥ upadeśaḥ abhūt vidyā-nipuṇaiḥ śrīmat-śaṅkara-bhagavat-caraṇaiḥ","w":[["द्वादश-मञ्जरिकाभिः","dvādaśa-mañjarikābhiḥ","in twelve flower-clusters (verses)","द्वादशमञ्जरिका","dvādaśamañjarikā","तृतीया, स्त्री, बहु","tṛtīyā, strī, bahu","f. ins. pl."],["अशेषः","aśeṣaḥ","complete","अशेष","aśeṣa","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg."],["कथितः","kathitaḥ","was told","कथ्","kath","क्त, प्रथमा, पुं, एक","kta, prathamā, puṃ, eka","past passive participle m. nom. sg."],["वैयाकरणस्य","vaiyākaraṇasya","to the grammarian","वैयाकरण","vaiyākaraṇa","षष्ठी, पुं, एक","ṣaṣṭhī, puṃ, eka","m. gen. sg."],["एषः","eṣaḥ","this","एतद्","etad","सर्वनाम, प्रथमा, पुं, एक","sarvanāma, prathamā, puṃ, eka","pronoun m. nom. sg."],["उपदेशः","upadeśaḥ","teaching","उपदेश","upadeśa","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg."],["अभूत्","abhūt","was (given)","भू","bhū" ."],["दशन-विहीनम्","daśana-vihīnam","toothless","दशनविहीन","daśanavihīna","प्रथमा, नपुं, एक","prathamā, napuṃ, eka","n. nom. sg."],["जातम्","jātam","has become","जात","jāta","क्त, प्रथमा, नपुं, एक","kta, prathamā, napuṃ, eka","past passive participle n. nom. sg."],["तुण्डम्","tuṇḍam","the mouth","तुण्ड","tuṇḍa","प्रथमा, नपुं, एक","prathamā, napuṃ, eka","n. nom. sg."],["वृद्धः","vṛddhaḥ","the old man","वृद्ध","vṛddha","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg."],["याति","yāti","walks","या","yā","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg."],["गृहीत्वा","gṛhītvā","holding","ग्रह्","grah","क्त्वा","ktvā","absolutive"],["दण्डम्","daṇḍam","a stick","दण्ड","daṇḍa","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg."],["तत्","tat","even","तद्","tad","अव्यय","avyaya","indeclinable"],["अपि","api","then","अपि","api","अव्यय","avyaya","indeclinable"],["न","na","not","न","na","अव्यय","avyaya","indeclinable"],["मुञ्चति","muñcati","lets go of","मुच्","muc","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg."],["आशा-पिण्डम्","āśā-piṇḍam","the bundle of desires","आशापिण्ड","āśāpiṇḍa","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg."]],"t":"The body has wasted, the head turned grey, the mouth become toothless. The old man walks leaning on a stick, and even then he does not let go of his bundle of desires.","notes":[],"by":"Toṭakācārya","var":[],"x":false},{"n":"16","d":"अग्रे वह्निः पृष्ठे भानुः\nरात्रौ चुबुकसमर्पितजानुः ।\nकरतलभिक्षस्तरुतलवास-\nस्तदपि न मुञ्चत्याशापाशः ॥ १६ ॥","i":"agre vahniḥ pṛṣṭhe bhānuḥ\nrātrau cubukasamarpitajānuḥ |\nkaratalabhikṣastarutalavāsa-\nstadapi na muñcatyāśāpāśaḥ || 16 ||","pd":"अग्रे वह्निः पृष्ठे भानुः रात्रौ चुबुक-समर्पित-जानुः कर-तल-भिक्षः तरु-तल-वासः तत् अपि न मुञ्चति आशा-पाशः","pi":"agre vahniḥ pṛṣṭhe bhānuḥ rātrau cubuka-samarpita-jānuḥ kara-tala-bhikṣaḥ taru-tala-vāsaḥ tat api na muñcati āśā-pāśaḥ","w":[["अग्रे","agre","in front","अग्र","agra","सप्तमी, नपुं, एक","saptamī, napuṃ, eka","n. loc. sg."],["वह्निः","vahniḥ" <script>
(function(){
  var D = JSON.parse(document.getElementById("data").textContent);
  var KEY = "vs-grantha-reader";
  var defaults = {iast:true, pd:false, wbw:false, lg:true, script:"deva"};
  var prefs = Object.assign({}, defaults);
  try { var s = JSON.parse(localStorage.getItem(KEY) || "{}"); Object.assign(prefs, s); } catch(e) {}
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(prefs)); } catch(e) {} }

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function el(id){ return document.getElementById(id); }

  el("t-deva").textContent = D.title.deva;
  el("t-iast").textContent = D.title.iast;
  el("t-en").textContent = D.title.en !== D.title.iast ? D.title.en : "";
  el("t-author").textContent = D.author;
  el("about").textContent = (D.about || []).join(" ");
  document.title = D.title.iast + " · Vedic Space";

  var sections = {};
  (D.sections || []).forEach(function(s){ sections[s.before] = s; });

  var html = [];
  D.verses.forEach(function(v){
    var s = sections[v.n];
    if (s) html.push('<div class="section"><div class="sd">' + esc(s.deva) + '</div><div class="si">' +
                     esc(s.iast) + ' · ' + esc(s.en) + '</div></div>');
    var tags = [];
    if (v.by) tags.push('<span class="tag">attributed to ' + esc(v.by) + '</span>');
    if (v.x) tags.push('<span class="tag">in some editions</span>');
    if (/[a-z]$/.test(v.n)) tags.push('<span class="tag">colophon</span>');
    var words = v.w.map(function(w){
      var g = w[5] || w[6] ? '<div class="wg"><span class="gd">' + esc(w[3]) + ' · ' + esc(w[5]) + '</span>' +
              '<span class="gi">' + esc(w[4]) + ' · ' + esc(w[6]) + '</span>' +
              (w[7] ? '<br>' + esc(w[7]) : '') + '</div>' : '';
      return '<div class="w"><div class="wd">' + esc(w[0]) + '</div><div class="wi">' + esc(w[1]) + '</div>' +
             '<div class="wm">' + esc(w[2]) + '</div>' + g + '</div>';
    }).join("");
    var notes = [];
    v.var.forEach(function(r){ notes.push('<p><b>Variant</b> ' + esc(r) + '</p>'); });
    v.notes.forEach(function(n){ notes.push('<p><b>Note</b> ' + esc(n) + '</p>'); });
    html.push(
      '<article class="verse" id="v' + esc(v.n) + '">' +
        '<div class="vhead">' + tags.join("") + '</div>' +
        '<div class="sa">' + esc(v.d) + '</div>' +
        '<div class="iast">' + esc(v.i) + '</div>' +
        '<div class="blk pd"><div class="lbl"><span>Padaccheda</span></div>' +
          '<div class="pd-d">' + esc(v.pd) + '</div><div class="pd-i">' + esc(v.pi) + '</div></div>' +
        '<div class="blk wbw"><div class="lbl"><span>Word by word</span><span class="ctl">' +
          '<button class="sw mini" data-pref="lg" aria-pressed="false"><span class="k"></span>Lemma &amp; grammar</button>' +
          '<span class="seg" role="group" aria-label="Script for lemma and grammar">' +
            '<button class="dv" data-script="deva" aria-pressed="false">देव</button>' +
            '<button data-script="iast" aria-pressed="false">IAST</button></span>' +
        '</span></div><div class="words">' + words + '</div></div>' +
        (v.t ? '<div class="tr">' + esc(v.t) + '</div>' : '') +
        (notes.length ? '<div class="notes">' + notes.join("") + '</div>' : '') +
      '</article>');
  });
  el("verses").innerHTML = html.join("");

  el("credits").innerHTML =
    '<p><b>Sanskrit text:</b> ' + esc(D.source) + ' (' + esc(D.source_ref) + '). ' + esc(D.credits) + '.</p>' +
    '<p><b>Word analysis, meanings and translation:</b> Vedic Space, draft prepared with Claude; awaiting review.</p>' +
    '<p><b>Fonts:</b> Tiro Devanagari Sanskrit, Noto Serif Devanagari and Noto Serif (SIL Open Font License).</p>' +
    '<p>Internal review copy. Not for publication.</p>';

  function apply(){
    document.body.classList.toggle("show-iast", !!prefs.iast);
    document.body.classList.toggle("show-pd", !!prefs.pd);
    document.body.classList.toggle("show-wbw", !!prefs.wbw);
    document.body.classList.toggle("show-lg", !!prefs.lg);
    document.body.classList.toggle("lg-iast", prefs.script === "iast");
    document.querySelectorAll("[data-pref]").forEach(function(b){
      b.setAttribute("aria-pressed", prefs[b.dataset.pref] ? "true" : "false"); });
    document.querySelectorAll("[data-script]").forEach(function(b){
      b.setAttribute("aria-pressed", prefs.script === b.dataset.script ? "true" : "false");
      b.closest(".seg").style.opacity = prefs.lg ? "1" : ".4"; });
  }
  document.addEventListener("click", function(e){
    var b = e.target.closest("[data-pref]");
    if (b) { prefs[b.dataset.pref] = !prefs[b.dataset.pref]; save(); apply(); return; }
    var s = e.target.closest("[data-script]");
    if (s) { prefs.script = s.dataset.script; if (!prefs.lg) prefs.lg = true; save(); apply(); }
  });
  apply();
})();
</script>
</body>
</html>
