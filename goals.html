<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vedic Space - Goals</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #0b0f19; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px 16px; }
    .container { width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 20px; }
    header { border-bottom: 1px solid #334155; padding-bottom: 16px; }
    header h1 { font-size: 24px; color: #a5b4fc; margin-bottom: 4px; }
    header small { color: #94a3b8; font-size: 14px; }
    .card { background: #131b2e; border: 1px solid #334155; border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
    .input-row { display: flex; gap: 8px; }
    input[type="text"], textarea { width: 100%; background: #1e293b; border: 1px solid #334155; color: #f8fafc; padding: 10px 14px; border-radius: 8px; outline: none; font-size: 14px; }
    input[type="text"]:focus, textarea:focus { border-color: #6366f1; }
    .btn { font-family: inherit; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; font-size: 14px; transition: opacity 0.2s; }
    .btn:hover { opacity: 0.9; }
    .btn-primary { background: #6366f1; color: #ffffff; padding: 10px 18px; }
    .btn-secondary { background: #1e293b; border: 1px solid #334155; color: #f8fafc; padding: 10px 14px; }
    .btn-accent { background: #ec4899; color: #ffffff; padding: 6px 12px; font-size: 13px; }
    .btn-danger { background: transparent; border: 1px solid #ef4444; color: #ef4444; font-size: 12px; padding: 5px 10px; }
    .flex-end { display: flex; justify-content: flex-end; }
    .goal-card { background: #131b2e; border: 1px solid #334155; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .goal-top { display: flex; align-items: flex-start; gap: 12px; }
    .checkbox { width: 22px; height: 22px; border-radius: 6px; border: 2px solid #334155; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; margin-top: 2px; }
    .goal-card.completed .checkbox { background: #10b981; border-color: #10b981; }
    .goal-card.completed .checkbox::after { content: "\2713"; color: #ffffff; font-size: 13px; font-weight: bold; }
    .goal-card.completed .goal-title { text-decoration: line-through; color: #94a3b8; }
    .goal-info { flex: 1; }
    .goal-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
    .goal-desc { font-size: 13px; color: #94a3b8; line-height: 1.4; }
    .meter { height: 6px; background: #1e293b; border-radius: 99px; overflow: hidden; margin-top: 8px; }
    .meter-fill { height: 100%; background: #6366f1; width: 0%; transition: width 0.3s; }
    .milestones { display: flex; flex-direction: column; gap: 6px; padding-left: 34px; }
    .milestone-item { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #94a3b8; cursor: pointer; }
    .milestone-item.done span { text-decoration: line-through; }
    .actions-row { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #334155; padding-top: 10px; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Vedic Space Goals</h1>
      <small>Action Meets Alignment (Firebase Connected)</small>
    </header>

    <div class="card">
      <div class="input-row">
        <input type="text" id="goal-title-input" placeholder="What goal are you accomplishing?" required="true">
        <button id="mic-btn" class="btn btn-secondary" type="button">Voice</button>
      </div>
      <textarea id="goal-desc-input" rows="2" placeholder="Sensory details: What does living this completed reality feel like?"></textarea>
      <input type="text" id="goal-milestones-input" placeholder="Milestones (comma separated, e.g. Design UI, Deploy)">
      <div class="flex-end">
        <button id="add-goal-btn" class="btn btn-primary" type="button">Track & Manifest</button>
      </div>
    </div>

    <div id="goals-list" style="display: flex; flex-direction: column; gap: 14px;"></div>
  </div>

  <script type="module">
    // 1. IMPORT FIREBASE
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, updateDoc, doc, deleteDoc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 2. PASTE YOUR CONFIG HERE
        const firebaseConfig = {
            apiKey: "AIzaSyDNODSDmwHVfqt2CSb0tPDZwJGYjov7Lt0",
            authDomain: "vedic-space.firebaseapp.com",
            projectId: "vedic-space",
            storageBucket: "vedic-space.firebasestorage.app",
            messagingSenderId: "465492860613",
            appId: "1:465492860613:web:701d9c3ab0cd4c5a3edaac"
        };


    // 3. INITIALIZE DB
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const goalsCollection = collection(db, "goals");

    const goalsList = document.getElementById('goals-list');
    const addGoalBtn = document.getElementById('add-goal-btn');
    const micBtn = document.getElementById('mic-btn');

    // 4. LISTEN FOR REAL-TIME CHANGES
    const q = query(goalsCollection, orderBy("createdAt", "desc"));
    onSnapshot(q, (snapshot) => {
      goalsList.innerHTML = '';
      snapshot.forEach((docSnap) => {
        const goal = docSnap.data();
        goal.id = docSnap.id;
        renderCard(goal);
      });
    });

    // 5. ADD GOAL TO FIREBASE
    addGoalBtn.onclick = async function() {
      const titleInput = document.getElementById('goal-title-input');
      const descInput = document.getElementById('goal-desc-input');
      const milesInput = document.getElementById('goal-milestones-input');

      const titleVal = titleInput.value.trim();
      if (!titleVal) return;

      const rawMiles = milesInput.value;
      const milestones = [];
      if (rawMiles) {
        rawMiles.split(',').forEach(function(part) {
          const item = part.trim();
          if (item) milestones.push({ text: item, done: false });
        });
      }

      await addDoc(goalsCollection, {
        title: titleVal,
        desc: descInput.value.trim(),
        milestones: milestones,
        completed: false,
        createdAt: serverTimestamp()
      });

      titleInput.value = '';
      descInput.value = '';
      milesInput.value = '';
    };

    // 6. RENDER CARDS
    function renderCard(goal) {
      const card = document.createElement('div');
      card.className = 'goal-card' + (goal.completed ? ' completed' : '');

      const total = goal.milestones ? goal.milestones.length : 0;
      let doneCount = 0;
      if (total !== 0) {
        goal.milestones.forEach(function(m) { if (m.done) doneCount++; });
      }
      const percent = total !== 0 ? (doneCount / total) * 100 : (goal.completed ? 100 : 0);

      let milestonesHtml = '';
      if (total !== 0) {
        milestonesHtml = '<div class="milestones">';
        goal.milestones.forEach(function(m, idx) {
          milestonesHtml += '<label class="milestone-item ' + (m.done ? 'done' : '') + '">';
          milestonesHtml += '<input type="checkbox" ' + (m.done ? 'checked' : '') + ' data-idx="' + idx + '">';
          milestonesHtml += '<span>' + m.text + '</span>';
          milestonesHtml += '</label>';
        });
        milestonesHtml += '</div>';
      }

      card.innerHTML = 
        '<div class="goal-top">' +
          '<div class="checkbox"></div>' +
          '<div class="goal-info">' +
            '<div class="goal-title">' + goal.title + '</div>' +
            (goal.desc ? '<div class="goal-desc">' + goal.desc + '</div>' : '') +
            '<div class="meter"><div class="meter-fill" style="width: ' + percent + '%;"></div></div>' +
          '</div>' +
        '</div>' +
        milestonesHtml +
        '<div class="actions-row">' +
          '<button class="btn btn-accent" type="button" data-action="tts">Manifest Audio (TTS)</button>' +
          '<button class="btn btn-danger" type="button" data-action="del">Delete</button>' +
        '</div>';

      // UPDATE COMPLETION IN FIREBASE
      card.querySelector('.checkbox').onclick = async function() {
        await updateDoc(doc(db, "goals", goal.id), { completed: !goal.completed });
      };

      // UPDATE MILESTONE IN FIREBASE
      const checkboxes = card.querySelectorAll('.milestone-item input');
      checkboxes.forEach(function(chk) {
        chk.onchange = async function(e) {
          const idx = Number(e.target.getAttribute('data-idx'));
          const updatedMilestones = [...goal.milestones];
          updatedMilestones[idx].done = e.target.checked;
          await updateDoc(doc(db, "goals", goal.id), { milestones: updatedMilestones });
        };
      });

      // MANIFESTATION AUDIO
      card.querySelector('[data-action="tts"]').onclick = function() {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const text = 'Take a deep breath. Embody the feeling of having completed: ' + goal.title + '. ' + (goal.desc || '') + '. It is done.';
          const msg = new SpeechSynthesisUtterance(text);
          msg.rate = 0.88;
          window.speechSynthesis.speak(msg);
        }
      };

      // DELETE FROM FIREBASE
      card.querySelector('[data-action="del"]').onclick = async function() {
        if (confirm("Delete this goal?")) {
          await deleteDoc(doc(db, "goals", goal.id));
        }
      };

      goalsList.appendChild(card);
    }

    // NATIVE VOICE RECOGNITION
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRec) {
      const rec = new SpeechRec();
      micBtn.onclick = function() {
        try { rec.start(); micBtn.textContent = 'Listening...'; } catch(e) { rec.stop(); }
      };
      rec.onresult = function(e) {
        document.getElementById('goal-title-input').value = e.results[0][0].transcript;
      };
      rec.onend = function() { micBtn.textContent = 'Voice'; };
    } else {
      micBtn.style.display = 'none';
    }

  </script>
</body>
</html>
