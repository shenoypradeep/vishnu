<script type="module">
// ==========================================
// FIREBASE FIRESTORE HYBRID ARCHITECTURE
// ==========================================
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getFirestore, collection, getDocs, query, where, updateDoc, deleteDoc, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

const GOOGLE_APP_URL = "https://script.google.com/macros/s/AKfycbyRMmFeftM55MPBtPR3dMknnO05SlV2sXbV-thjweCdgzkv5HxTXaBOLawZtJBQQOR2VA/exec";

const firebaseConfig = {
    apiKey: "AIzaSyDNODSDmwHVfqt2CSb0tPDZwJGYjov7Lt0",
    authDomain: "vedic-space.firebaseapp.com",
    projectId: "vedic-space",
    storageBucket: "vedic-space.firebasestorage.app",
    messagingSenderId: "465492860613",
    appId: "1:465492860613:web:701d9c3ab0cd4c5a3edaac"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.globalAudioBlob = null;
window.mediaRecorder = null;
window.audioChunks = [];
window.isRecording = false;
window.pIdx = 1;

let APP_CONFIG = null;
const FALLBACK_CONFIG = {
    settings: { meditationBellUrl: "./assets/taala.mp3" },
    navigation: [
        { id: "sadhana", title: "Learn VSS", icon: "refresh-cw", enabled: true },		
        { id: "sanskrit", title: "Akṣara", icon: "book-open", enabled: true },
        { id: "review", title: "Shloka Review", icon: "check-circle", enabled: true }
    ],
    sanskrit: [
        { "title": "Sanskrit Alphabets", "id": "PLFLFOfuyaIHvExkYbtlMM_mS1m5yRZtO2", "type": "playlist", "videos": [
            { "title": "Part 1: The Vowels", "id": "yA2X2vA" }
        ]}
    ]
};

document.addEventListener('DOMContentLoaded', async () => { 
    try {
        const docRef = doc(db, "app_config", "main_settings");
        const docSnap = await getDoc(docRef);
        if (docSnap.exists()) {
            APP_CONFIG = docSnap.data();
        } else {
            APP_CONFIG = FALLBACK_CONFIG;
        }
    } catch(e) {
        APP_CONFIG = FALLBACK_CONFIG;
    }
    checkUserSession();
    initDynamicUI();
    feather.replace();
});

function checkUserSession() {
    const userName = localStorage.getItem('vss_user_name');
    const userId = localStorage.getItem('vss_user_id');
    const userRole = localStorage.getItem('vss_user_role') || 'learner';
    const nameDisplay = document.getElementById('user-first-name');
    const roleDisplay = document.getElementById('user-role-badge');
    
    if (userId && userName && userName !== 'guest_user') {
        nameDisplay.innerText = userName.split(' ')[0];
        nameDisplay.style.display = 'inline-block';
        if (userRole === 'teacher' || userRole === 'admin') {
            roleDisplay.innerText = userRole;
            roleDisplay.style.display = 'block';
        }
    } else {
        nameDisplay.innerText = 'Login >';
        nameDisplay.style.display = 'inline-block';
    }
}

window.handleUserIconClick = function() {
    if (!localStorage.getItem('vss_user_id') || localStorage.getItem('vss_user_id') === 'guest_user') {
        window.location.href = 'login_test.html'; 
    } else {
        const dropdown = document.getElementById('logout-dropdown');
        dropdown.style.display = dropdown.style.display === 'none' ? 'block' : 'none';
    }
}

window.logoutUser = function() {
    localStorage.removeItem('vss_user_id');
    localStorage.removeItem('vss_user_name');
    localStorage.removeItem('vss_user_role');
    window.location.href = 'login_test.html'; 
}

function initDynamicUI() {
    const dNav = document.getElementById('desktop-nav-container');
    const mNav = document.getElementById('main-nav');
    const contentContainer = document.getElementById('app-content-container');
    const userRole = localStorage.getItem('vss_user_role') || 'learner';
    
    APP_CONFIG.navigation.forEach(item => {
        if(item.id === 'review' && userRole === 'guest') return; 
        dNav.innerHTML += `<li><a onclick="window.showTab('${item.id}')" id="t-${item.id}">${item.title}</a></li>`;
        mNav.innerHTML += `<div class="nav-item" onclick="window.showTab('${item.id}')" id="n-${item.id}"><i data-feather="${item.icon}"></i><span style="margin-top: 4px;">${item.title}</span></div>`;
        contentContainer.innerHTML += getPaneHTML(item.id);
    });

    if(APP_CONFIG.navigation[0]) window.showTab(APP_CONFIG.navigation[0].id); 
}

function getPaneHTML(id) {
    if(id === 'review') return `
        <section id="v-review" class="view">
            <div class="card" style="padding: 15px; background: transparent; border: none;">
                <h3 class="serif" style="margin-bottom: 25px; color: var(--gold); text-align: center; font-size: 1.4rem;">Shloka Review</h3>
                <div id="review-loading" style="text-align: center; color: var(--gold); font-size: 13px;">Loading recordings...</div>
                <div id="review-container"></div>
            </div>
        </section>`;

    if(id === 'sadhana') return `
        <section id="v-sadhana" class="view">
            <div id="sadhana-container" style="padding: 15px 10px; text-align: center; position: relative;">
                <h3 class="serif" style="color: var(--gold); font-size: 1.1rem; margin-bottom:10px;">।। श्री विष्णु सहस्रनाम ।।</h3>
                <div class="slide-wrapper">
                    <img id="sadhana-slide" src="./parayana/Slide1.webp" style="display: block;">
                    <button onclick="window.navSlide(-1)" style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.5); border: none; color: white; border-radius: 50%; width: 40px; height: 40px;"><i data-feather="chevron-left"></i></button>
                    <button onclick="window.navSlide(1)" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.5); border: none; color: white; border-radius: 50%; width: 40px; height: 40px;"><i data-feather="chevron-right"></i></button>
                </div>
                <button onclick="window.toggleRecordSection()" style="margin-top: 20px; background: var(--gold); border: none; color: var(--bg); padding: 10px 20px; border-radius: 20px; font-weight: bold; cursor: pointer;"><i data-feather="mic" style="width:14px;"></i> Record Chanting</button>
                
                <div id="recording-pane" class="recording-section" style="max-height:0; overflow:hidden; transition: 0.3s; margin-top:15px; background: rgba(0,0,0,0.3); border-radius: 15px; padding: 0 15px;">
                    <div style="padding: 15px 0;">
                        <h4 class="serif" style="color: var(--gold); margin-bottom: 5px;">Record Your Chanting</h4>
                        <p id="shloka-indicator" style="font-size: 12px; margin-bottom: 20px; color: white;"></p>
                        <button onclick="window.toggleMicrophone()" id="record-btn" style="background: rgba(255,255,255,0.1); border: 1px solid var(--border); color: white; border-radius: 50%; width: 60px; height: 60px;"><i data-feather="mic" id="record-icon"></i></button>
                        <audio id="audio-preview" controls style="width: 100%; display: none; margin-top: 15px; height: 40px; border-radius: 8px;"></audio>
                        <button id="submit-audio-btn" onclick="window.submitAudioRecording()" style="display: none; width: 100%; margin-top:15px; background: linear-gradient(135deg, var(--gold), #d97706); border: none; color: var(--bg); padding: 14px; border-radius: 12px; font-weight: bold;"><i data-feather="upload-cloud"></i> Submit Recording</button>
                        <div id="audio-status" style="font-size: 13px; margin-top: 15px; color: var(--gold);"></div>
                    </div>
                </div>
            </div>
        </section>`;

    return `<section id="v-${id}" class="view"><div class="card"><h3 class="serif" style="color:var(--gold);">${id} Pane</h3></div></section>`;
}

window.showTab = function(t){
    const userId = localStorage.getItem('vss_user_id') || 'guest_user';
    if (userId === 'guest_user' && t !== 'sadhana') { window.showGuestPopup(); return; }
    document.querySelectorAll('.view,.nav-item').forEach(el=>el.classList.remove('active'));
    document.querySelectorAll('.nav-links a').forEach(el=>el.classList.remove('active-link'));
    if(document.getElementById('v-'+t)) document.getElementById('v-'+t).classList.add('active');
    if(document.getElementById('n-'+t)) document.getElementById('n-'+t).classList.add('active');
    if(t === 'review') window.loadReviews();
    feather.replace();
}

window.navSlide = function(dir){ 
    window.pIdx += dir; 
    if(window.pIdx > 109) window.pIdx = 1; 
    if(window.pIdx < 1) window.pIdx = 109; 
    document.getElementById('sadhana-slide').src = `./parayana/Slide${window.pIdx}.webp`; 
    const ind = document.getElementById('shloka-indicator');
    if(ind) ind.innerText = window.pIdx > 2 ? `Submitting for: Shloka ${window.pIdx - 2}` : `Submitting for: Setup/Intro`;
}

window.toggleRecordSection = () => {
    const pane = document.getElementById('recording-pane');
    if (pane.style.maxHeight === '0px' || pane.style.maxHeight === '') {
        pane.style.maxHeight = '500px';
        pane.style.padding = '15px';
        document.getElementById('shloka-indicator').innerText = window.pIdx > 2 ? `Submitting for: Shloka ${window.pIdx - 2}` : `Submitting for: Setup/Intro`;
    } else {
        pane.style.maxHeight = '0px';
        pane.style.padding = '0 15px';
    }
};

window.toggleMicrophone = function() {
    const recordBtn = document.getElementById('record-btn');
    const recordIcon = document.getElementById('record-icon');
    const audioPreview = document.getElementById('audio-preview');
    const submitBtn = document.getElementById('submit-audio-btn');

    if(!window.isRecording) {
        navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
            window.mediaRecorder = new MediaRecorder(stream);
            window.audioChunks = [];
            window.mediaRecorder.ondataavailable = e => { if (e.data.size > 0) window.audioChunks.push(e.data); };
            window.mediaRecorder.onstop = () => {
                window.globalAudioBlob = new Blob(window.audioChunks, { type: window.mediaRecorder.mimeType || 'audio/webm' });
                audioPreview.src = URL.createObjectURL(window.globalAudioBlob);
                audioPreview.style.display = 'block';
                submitBtn.style.display = 'flex';
                stream.getTracks().forEach(track => track.stop());
            };
            window.mediaRecorder.start();
            window.isRecording = true;
            recordBtn.style.background = '#ff4757';
            recordIcon.setAttribute('data-feather', 'square');
            feather.replace();
            audioPreview.style.display = 'none';
            submitBtn.style.display = 'none';
        });
    } else {
        window.mediaRecorder.stop();
        window.isRecording = false;
        recordBtn.style.background = 'rgba(255,255,255,0.1)';
        recordIcon.setAttribute('data-feather', 'mic');
        feather.replace();
    }
}

// HYBRID UPLOAD: Send to Apps Script -> Gets Drive URL -> Saves to Firestore
window.submitAudioRecording = async () => {
    const submitBtn = document.getElementById('submit-audio-btn');
    const statusText = document.getElementById('audio-status');
    const audioPreview = document.getElementById('audio-preview');

    if(!window.globalAudioBlob) return;
    const userId = localStorage.getItem('vss_user_id') || 'guest_user';
    const userName = localStorage.getItem('vss_user_name') || 'Guest';

    submitBtn.disabled = true;
    statusText.innerText = "Processing and uploading...";
    statusText.style.color = "var(--gold)";

    try {
        const base64data = await new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(window.globalAudioBlob);
            reader.onloadend = () => resolve(reader.result.split(',')[1]);
        });

        // 1. Send File to Google Apps Script (Drive)
        const uploadRes = await fetch(GOOGLE_APP_URL, {
            method: 'POST',
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({
                action: "UPLOAD_AUDIO",
                audioBase64: base64data,
                mimeType: window.globalAudioBlob.type || 'audio/webm'
            })
        });
        const uploadData = await uploadRes.json();
        
        if(uploadData.status !== "success") throw new Error("Drive Upload Failed");

        // 2. Save Fast Record to Firestore
        const timestamp = new Date().getTime();
        const shlokaNum = window.pIdx > 2 ? `Shloka ${window.pIdx - 2}` : `Setup/Intro`;
        const shlokaId = `${timestamp}_${userId}`; 

        await setDoc(doc(db, "shloka_logs", shlokaId), {
            shlokaId: shlokaId,
            timestamp: timestamp,
            userId: userId,
            userName: userName,
            shloka: shlokaNum,
            audioLink: uploadData.url, // URL from Google Drive!
            feedbackText: "",
            feedbackAudio: ""
        });

        statusText.innerHTML = "✅ Successfully submitted to teacher!";
        statusText.style.color = "#2ed573";
        submitBtn.style.display = 'none';
        audioPreview.style.display = 'none';
        window.globalAudioBlob = null;
    } catch(error) {
        statusText.innerText = "Error uploading. Check internet.";
        statusText.style.color = "#ff4757";
        submitBtn.disabled = false;
    }
};

// URL EXTRACTOR FOR IFRAMES (BYPASSES DRIVE BLOCKS COMPLETELY)
function getIframeUrl(url) {
    if (!url) return "";
    let fileId = "";
    const dMatch = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
    if (dMatch && dMatch[1]) fileId = dMatch[1];
    else if (url.includes("id=")) {
        const idMatch = url.match(/id=([a-zA-Z0-9_-]+)/);
        if (idMatch && idMatch[1]) fileId = idMatch[1];
    }
    // Forces Google Drive Native Player UI
    if (fileId) return `https://drive.google.com/file/d/${fileId}/preview`;
    return url;
}

window.loadReviews = async function() {
    document.getElementById('review-loading').style.display = 'block';
    document.getElementById('review-container').innerHTML = '';
    const userId = localStorage.getItem('vss_user_id');
    const role = localStorage.getItem('vss_user_role') || 'learner';
    
    try {
        const logsRef = collection(db, "shloka_logs");
        let q = (role === 'admin' || role === 'teacher') ? logsRef : query(logsRef, where("userId", "==", userId));
        
        const querySnapshot = await getDocs(q);
        const logs = [];
        querySnapshot.forEach((doc) => logs.push(doc.data()));
        window.renderReviews(logs, role);
    } catch (e) {
        document.getElementById('review-loading').innerText = 'Error connecting to Firestore.';
    }
}

window.renderReviews = function(logs, role) {
    const container = document.getElementById('review-container');
    document.getElementById('review-loading').style.display = 'none';
    if (!logs || logs.length === 0) { container.innerHTML = '<p style="text-align: center; opacity: 0.6; font-size: 13px;">No recordings found.</p>'; return; }
    
    logs.sort((a,b) => b.timestamp - a.timestamp);

    if (role === 'teacher' || role === 'admin') {
        const grouped = {};
        logs.forEach(l => { if(!grouped[l.userName]) grouped[l.userName] = []; grouped[l.userName].push(l); });
        
        let html = '';
        for (const [studentName, studentLogs] of Object.entries(grouped)) {
            let idSafe = studentName.replace(/\s+/g, '-').replace(/[^a-zA-Z0-9-]/g, '').toLowerCase();
            let pendingCount = studentLogs.filter(l => !l.feedbackText && !l.feedbackAudio).length;
            let highlightStyle = pendingCount > 0 ? 'border: 1px solid #ff4757;' : 'border: 1px solid var(--border);';
            let pendingBadge = pendingCount > 0 ? `<span style="font-size: 11px; color: white; background: #ff4757; padding: 2px 6px; border-radius: 6px; margin-left: 8px;">${pendingCount} Pending</span>` : '';

            html += `
                <div style="margin-bottom: 10px; background: rgba(0,0,0,0.3); ${highlightStyle} border-radius: 12px; overflow: hidden;">
                    <button onclick="window.toggleReviewAccordion('${idSafe}')" style="width: 100%; background: rgba(255,255,255,0.05); padding: 15px; border: none; color: white; display: flex; justify-content: space-between; align-items: center; cursor: pointer;">
                        <span>${studentName} ${pendingBadge}</span>
                        <i data-feather="chevron-down" id="chevron-${idSafe}" style="width: 16px; color: var(--gold);"></i>
                    </button>
                    <div id="acc-${idSafe}" style="max-height: 0; overflow: hidden; transition: 0.4s ease-out;">
                        <div style="padding: 15px;">${studentLogs.map(l => window.buildReviewItem(l, role)).join('')}</div>
                    </div>
                </div>`;
        }
        container.innerHTML = html;
    } else {
        container.innerHTML = logs.map(l => window.buildReviewItem(l, role)).join('');
    }
    feather.replace();
}

window.buildReviewItem = function(log, role) {
    let dateObj = new Date(log.timestamp);
    let dateStr = dateObj.toLocaleDateString() + ' ' + dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    let teacherFeedbackHTML = '';
    
    // Convert old/new URLs to native IFrames
    let iframeLearnerAudio = getIframeUrl(log.audioLink);
    let iframeTeacherAudio = getIframeUrl(log.feedbackAudio);

    if (role === 'teacher' || role === 'admin') {
        teacherFeedbackHTML = `
            <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--border);">
                <p style="font-size: 12px; color: var(--gold); margin-bottom: 5px;">Teacher Feedback</p>
                <textarea id="feedback-text-${log.shlokaId}" class="search-input" style="min-height: 60px; margin-bottom: 10px;">${log.feedbackText}</textarea>
                ${log.feedbackAudio ? `<iframe src="${iframeTeacherAudio}" style="width: 100%; height: 60px; border: none; border-radius: 8px; background: white; margin-bottom:10px;"></iframe>` : ''}
                <button id="fb-submit-btn-${log.shlokaId}" onclick="window.submitFeedback('${log.shlokaId}')" style="width: 100%; background: var(--gold); border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer;">Save Feedback</button>
                <div id="fb-status-${log.shlokaId}" style="font-size: 12px; color: var(--gold); margin-top: 5px;"></div>
            </div>`;
    } else {
        let learnerActions = `
            <div style="margin-top: 15px; display: flex; gap: 10px;">
                <button onclick="window.deleteRecording('${log.shlokaId}')" style="background: rgba(255, 71, 87, 0.1); border: 1px solid #ff4757; color: #ff4757; padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer;"><i data-feather="trash-2" style="width: 14px;"></i> Delete</button>
            </div>`;
            
        if(log.feedbackText || log.feedbackAudio) {
            teacherFeedbackHTML = `
                <div style="margin-top: 15px; padding: 15px; background: rgba(251, 191, 36, 0.08); border-left: 2px solid var(--gold); border-radius: 8px;">
                    <p style="font-size: 12px; color: var(--gold); margin-bottom: 5px; font-weight: bold;">Teacher Review</p>
                    ${log.feedbackText ? `<p style="font-size: 13px; color: white;">${log.feedbackText}</p>` : ''}
                    ${log.feedbackAudio ? `<iframe src="${iframeTeacherAudio}" style="width: 100%; height: 60px; border: none; border-radius: 8px; background: white; margin-top:10px;"></iframe>` : ''}
                </div>`;
        } else {
            teacherFeedbackHTML = `<p style="font-size: 12px; color: rgba(255,255,255,0.4); font-style: italic; margin-top:15px;">Review pending...</p>`;
        }
        teacherFeedbackHTML = learnerActions + teacherFeedbackHTML;
    }

    return `
        <div id="review-item-${log.shlokaId}" style="padding: 15px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; margin-bottom: 15px; text-align: left;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                <span style="font-weight: bold; color: var(--gold); font-size: 14px;">${log.shloka}</span>
                <span style="font-size: 11px; opacity: 0.6;">${dateStr}</span>
            </div>
            <iframe src="${iframeLearnerAudio}" style="width: 100%; height: 60px; border: none; border-radius: 8px; background: white;"></iframe>
            ${teacherFeedbackHTML}
        </div>`;
}

window.toggleReviewAccordion = (id) => {
    const items = document.getElementById('acc-' + id);
    if (items.style.maxHeight === '0px' || items.style.maxHeight === '') items.style.maxHeight = '2000px'; 
    else items.style.maxHeight = '0px';
};

window.submitFeedback = async (shlokaId) => {
    const text = document.getElementById(`feedback-text-${shlokaId}`).value;
    const status = document.getElementById(`fb-status-${shlokaId}`);
    const btn = document.getElementById(`fb-submit-btn-${shlokaId}`);
    
    btn.disabled = true; status.innerText = "Saving to Database...";
    try {
        await updateDoc(doc(db, "shloka_logs", shlokaId), { feedbackText: text });
        status.innerText = "✅ Saved!";
        setTimeout(() => { btn.disabled = false; status.innerText = ""; }, 2000);
    } catch (e) {
        status.innerText = "Error saving."; btn.disabled = false;
    }
};

window.deleteRecording = async (shlokaId) => {
    if(!confirm("Are you sure you want to delete this recording?")) return;
    document.getElementById(`review-item-${shlokaId}`).style.opacity = '0.4';
    try {
        await deleteDoc(doc(db, "shloka_logs", shlokaId));
        window.loadReviews(); 
    } catch (e) { alert("Failed to delete recording."); }
};
</script>
