// --- USER SESSION AND GUEST LOGIC ---
function checkUserSession() {
    const userName = localStorage.getItem('vss_user_name');
    const userId = localStorage.getItem('vss_user_id');
    const userRole = localStorage.getItem('vss_user_role') || 'learner';
    const nameDisplay = document.getElementById('user-first-name');
    const roleDisplay = document.getElementById('user-role-badge');
    
    if (userId && userName && userName !== 'guest_user') {
        const firstName = userName.split(' ')[0];
        nameDisplay.innerText = firstName;
        nameDisplay.style.display = 'inline-block';
        
        if (userRole === 'teacher' || userRole === 'admin') {
            roleDisplay.innerText = userRole;
            roleDisplay.style.display = 'block';
        }
    } else {
        nameDisplay.innerText = 'Login >';
        nameDisplay.style.display = 'inline-block';
    }
}

function handleUserIconClick() {
    const userId = localStorage.getItem('vss_user_id');
    if (!userId || userId === 'guest_user') {
        window.location.href = 'login_test.html'; 
    } else {
        const dropdown = document.getElementById('logout-dropdown');
        dropdown.style.display = dropdown.style.display === 'none' ? 'block' : 'none';
    }
}

function logoutUser() {
    const email = localStorage.getItem('vss_user_id');
    if(email && email !== 'guest_user') {
        fetch(GOOGLE_APP_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: "LOGOUT", userId: email })
        });
    }
    localStorage.removeItem('vss_user_id');
    localStorage.removeItem('vss_user_name');
    localStorage.removeItem('vss_user_role');
    window.location.href = 'login_test.html'; 
}

window.addEventListener('click', function(e) {
    if (!e.target.closest('.user-menu-container')) {
        const dropdown = document.getElementById('logout-dropdown');
        if (dropdown) dropdown.style.display = 'none';
    }
});

function showGuestPopup() {
    const overlay = document.getElementById('guest-overlay');
    const popup = document.getElementById('guest-popup');
    const fsElement = document.fullscreenElement || document.webkitFullscreenElement;

    if (fsElement) {
        fsElement.appendChild(overlay);
        fsElement.appendChild(popup);
    } else {
        document.body.appendChild(overlay);
        document.body.appendChild(popup);
    }

    overlay.classList.add('active');
    popup.classList.add('active');
    feather.replace();
}

function closeGuestPopup() {
    document.getElementById('guest-overlay').classList.remove('active');
    document.getElementById('guest-popup').classList.remove('active');
}

function toggleRecordSection() {
    const pane = document.getElementById('recording-pane');
    const btn = document.getElementById('expand-record-btn');
    const indicator = document.getElementById('shloka-indicator');
    
    if (pane.style.maxHeight === '0px' || pane.style.maxHeight === '') {
        pane.classList.add('expanded');
        pane.style.maxHeight = '500px';
        pane.style.opacity = '1';
        
        btn.style.background = 'var(--gold)';
        btn.style.color = 'var(--bg)';
        
        indicator.innerText = window.pIdx > 2 ? `Submitting for: Shloka ${window.pIdx - 2}` : `Submitting for: Setup/Intro`;
        setTimeout(() => pane.scrollIntoView({ behavior: 'smooth', block: 'center' }), 150);
    } else {
        pane.classList.remove('expanded');
        pane.style.maxHeight = '0px';
        pane.style.opacity = '0';
        btn.style.background = 'transparent';
        btn.style.color = 'var(--gold)';
    }
}

// --- PWA INSTALLATION LOGIC ---
let deferredPrompt;
const installBtn = document.getElementById('install-app-btn');

window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    if (installBtn) {
        installBtn.style.display = 'flex';
        feather.replace(); 
    }
});

if (installBtn) {
    installBtn.addEventListener('click', async () => {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            deferredPrompt = null;
            installBtn.style.display = 'none';
        }
    });
}

window.addEventListener('appinstalled', () => {
    if (installBtn) installBtn.style.display = 'none';
    deferredPrompt = null;
});

async function loadConfig() {
    try {
        const response = await fetch('./app_config/learnvss_config.json');
        if (response.ok) {
            APP_CONFIG = await response.json();
            if (!APP_CONFIG.sanskrit) APP_CONFIG.sanskrit = FALLBACK_CONFIG.sanskrit;
            if (!APP_CONFIG.pranayamas) APP_CONFIG.pranayamas = FALLBACK_CONFIG.pranayamas;
            if (!APP_CONFIG.meditations) APP_CONFIG.meditations = FALLBACK_CONFIG.meditations;
        } else {
            throw new Error("Config not found");
        }
    } catch (e) { 
        APP_CONFIG = FALLBACK_CONFIG;
    }

    if (!APP_CONFIG.navigation.find(n => n.id === 'review')) {
        APP_CONFIG.navigation.splice(4, 0, { id: "review", title: "Shloka Review", icon: "check-circle", enabled: true });
    }

    if (APP_CONFIG.sanskrit) {
        APP_CONFIG.sanskrit.sort((a, b) => {
            if (a.type === 'playlist' && b.type !== 'playlist') return -1;
            if (a.type !== 'playlist' && b.type === 'playlist') return 1;
            return 0;
        });
    }

    initDynamicUI();
}

function initDynamicUI() {
    const dNav = document.getElementById('desktop-nav-container');
    const mNav = document.getElementById('main-nav');
    const contentContainer = document.getElementById('app-content-container');
    const userRole = localStorage.getItem('vss_user_role') || 'learner';
    
    dNav.innerHTML = ''; mNav.innerHTML = ''; contentContainer.innerHTML = '';
    
    APP_CONFIG.navigation.filter(item => item.enabled !== false && !['mandala', 'learn', 'sangha'].includes(item.id)).forEach(item => {
        if(item.id === 'anubhava' && userRole === 'guest') return;
        if(item.id === 'review' && userRole === 'guest') return; 

        let title = item.title;
        if(item.id === 'drop') title = 'Arpanam';
        if(item.id === 'sanskrit') title = 'Akṣara';

        dNav.innerHTML += `<li><a onclick="showTab('${item.id}')" id="t-${item.id}">${title}</a></li>`;
        mNav.innerHTML += `<div class="nav-item" onclick="showTab('${item.id}')" id="n-${item.id}"><i data-feather="${item.icon}"></i><span style="margin-top: 4px; font-family:'Inter', sans-serif;">${title}</span></div>`;
        contentContainer.innerHTML += getPaneHTML(item.id);
    });

    feather.replace();
    const firstPane = APP_CONFIG.navigation.find(item => item.enabled !== false && !['mandala', 'learn', 'sangha'].includes(item.id));
    if(firstPane) showTab(firstPane.id); 
    bindTouchEvents();
}

function renderWheelItems(type, items) {
    const sourceData = type === 'pran' ? APP_CONFIG.pranayamas : APP_CONFIG.meditations;
    const wheel = document.getElementById(`wheel-${type}`);
    const innerHTML = items.map(item => {
        const origIdx = sourceData.indexOf(item);
        return `<div class="wheel-item" data-orig-idx="${origIdx}" onclick="selectFromWheel('${type}', ${origIdx})">${item.title}</div>`;
    }).join('');
    wheel.innerHTML = `<div class="wheel-pad"></div>${innerHTML}<div class="wheel-pad"></div>`;
    wheel.scrollTop = 0;
    handleWheelScroll(type, true);
}

function handleWheelScroll(type, preventRender = false) {
    const sourceData = type === 'pran' ? APP_CONFIG.pranayamas : APP_CONFIG.meditations;
    const wheel = document.getElementById(`wheel-${type}`);
    const items = wheel.querySelectorAll('.wheel-item');
    const wheelCenter = wheel.getBoundingClientRect().top + (wheel.clientHeight / 2);
    
    let closestItem = null;
    let closestDist = Infinity;
    
    items.forEach(item => {
        const rect = item.getBoundingClientRect();
        if(rect.height === 0) return; 
        const itemCenter = rect.top + (rect.height / 2);
        const dist = Math.abs(wheelCenter - itemCenter);
        if (dist < closestDist) { closestDist = dist; closestItem = item; }
        item.classList.remove('active');
    });
    
    if (closestItem) {
        closestItem.classList.add('active');
        if (!preventRender) {
            clearTimeout(scrollTimeouts[type]);
            scrollTimeouts[type] = setTimeout(() => {
                const origIdx = closestItem.getAttribute('data-orig-idx');
                if (type === 'pran') {
                    const input = document.getElementById(`input-${type}`);
                    if (document.activeElement !== input) input.value = sourceData[origIdx].title;
                } else {
                    renderMediaHTML(type, sourceData[origIdx]);
                    const input = document.getElementById(`input-${type}`);
                    if (document.activeElement !== input) input.value = sourceData[origIdx].title;
                }
            }, 300);
        }
    }
}

function selectFromWheel(type, origIdx) {
    const sourceData = type === 'pran' ? APP_CONFIG.pranayamas : APP_CONFIG.meditations;
    const title = sourceData[origIdx].title;
    document.getElementById(`input-${type}`).value = title;
    if (type === 'pran') {
        document.getElementById('pran-timer-container').style.display = 'none';
        document.getElementById('display-pran').style.display = 'block';
    }
    renderMediaHTML(type, sourceData[origIdx]);
    collapsePicker(type);
}

function toggleMicrophone() {
    const recordBtn = document.getElementById('record-btn');
    const recordIcon = document.getElementById('record-icon');
    const timerDisplay = document.getElementById('record-timer');
    const audioPreview = document.getElementById('audio-preview');
    const submitBtn = document.getElementById('submit-audio-btn');
    const statusText = document.getElementById('audio-status');

    if(!window.isRecording) {
        navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
            window.mediaRecorder = new MediaRecorder(stream);
            window.audioChunks = [];
            window.mediaRecorder.ondataavailable = e => { if (e.data.size > 0) window.audioChunks.push(e.data); };

            window.mediaRecorder.onstop = () => {
                window.globalAudioBlob = new Blob(window.audioChunks, { type: window.mediaRecorder.mimeType || 'audio/webm' });
                audioPreview.src = URL.createObjectURL(window.globalAudioBlob);
                audioPreview.style.display = 'block';
                submitBtn.style.display = 'flex';
                stream.getTracks().forEach(track => track.stop());
            };

            window.mediaRecorder.start();
            window.isRecording = true;
            
            recordBtn.style.background = '#ff4757';
            recordBtn.style.borderColor = '#ff4757';
            recordIcon.setAttribute('data-feather', 'square');
            feather.replace();
            audioPreview.style.display = 'none';
            submitBtn.style.display = 'none';
            statusText.innerText = "";
            
            window.seconds = 0;
            timerDisplay.innerText = "00:00";
            window.timerInterval = setInterval(() => {
                window.seconds++;
                let m = Math.floor(window.seconds / 60).toString().padStart(2, '0');
                let s = (window.seconds % 60).toString().padStart(2, '0');
                timerDisplay.innerText = `${m}:${s}`;
            }, 1000);
        }).catch(err => { alert("Microphone access denied or not available on this device."); });
    } else {
        window.mediaRecorder.stop();
        window.isRecording = false;
        clearInterval(window.timerInterval);
        recordBtn.style.background = 'rgba(255,255,255,0.1)';
        recordBtn.style.borderColor = 'var(--border)';
        recordIcon.setAttribute('data-feather', 'mic');
        feather.replace();
    }
}

window.submitAudioRecording = async () => {

    const statusText = document.getElementById('audio-status');
    const audioPreview = document.getElementById('audio-preview');
    const timerDisplay = document.getElementById('record-timer');

    if(!window.globalAudioBlob || window.globalAudioBlob.size === 0) return;

    const userName = localStorage.getItem('vss_user_name') || 'Guest';

    if (userId === 'guest_user') { alert("Please log in to submit your recording."); return; }

    submitBtn.disabled = true;
    submitBtn.innerHTML = "Processing Audio...";
    statusText.innerText = "Saving to Server...";
    statusText.style.color = "var(--gold)";

    try {
        if(!db) throw new Error("Firestore DB not initialized.");

        // Convert Audio to Base64 String to bypass Google Drive limitations entirely
        const base64data = await new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(window.globalAudioBlob);
            reader.onloadend = () => resolve(reader.result);
        });

        const timestamp = new Date().getTime();
        const shlokaNum = window.pIdx > 2 ? `Shloka ${window.pIdx - 2}` : `Setup/Intro`;

        await db.collection("shloka_logs").doc(shlokaId).set({
            Shloka_ID: shlokaId,
            Timestamp: timestamp,
            User_ID: userId,
            Name: userName,
            Shloka_num: shlokaNum,
            Audio_Link: base64data,
            MIME_Type: window.globalAudioBlob.type || 'audio/webm',
            Teacher_Feedback_Text: "",
            Teacher_Audio_Link: ""
        });

        statusText.innerHTML = "✅ Recording successfully submitted to the teacher!";
        statusText.style.color = "#2ed573";
        
        submitBtn.style.display = 'none';
        audioPreview.style.display = 'none';
        audioPreview.src = ""; 
        window.globalAudioBlob = null;
        timerDisplay.innerText = "00:00";
        
        setTimeout(() => { statusText.innerHTML = ""; }, 5000);

    } catch(error) {
        console.error(error);
        statusText.innerText = "Error uploading. Please check your internet connection.";
        statusText.style.color = "#ff4757";
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<i data-feather="upload-cloud" style="width: 18px; margin-right: 8px;"></i> Submit Recording`;
        feather.replace();
    }
};

// --- SANSKRIT LIST SCROLL ISOLATION ---
function initSanskritUI(activeIndex = null) {
    const mainList = document.getElementById('sanskrit-main-list');
    const playerList = document.getElementById('sanskrit-player-list');
    const data = APP_CONFIG.sanskrit || [];
    
    let generateListHtml = () => {
        let html = '';
        data.forEach((item, index) => {
            const isActive = index === activeIndex;
            const isPlaylist = item.type === 'playlist';
            const iconName = isPlaylist ? 'list' : 'youtube';
            const activeClass = isActive ? 'active' : '';
            const badge = isPlaylist ? `<span style="font-size: 9px; color: var(--gold); border: 1px solid var(--gold); padding: 1px 5px; border-radius: 8px; margin-left: 8px; letter-spacing: 0.5px; font-weight: 600;">PLAYLIST</span>` : '';
            const titleColor = isActive ? 'var(--gold)' : 'white';
            const fontWeight = isActive ? '500' : '400';
            const bgColor = isActive ? 'rgba(251,191,36,0.08)' : 'rgba(255,255,255,0.04)';
            const borderColor = isActive ? 'var(--gold)' : 'rgba(255,255,255,0.08)';

            html += `
                <div class="sanskrit-list-item ${activeClass}" style="background: ${bgColor}; border: 1px solid ${borderColor}; padding: 12px 15px; border-radius: 8px; margin-bottom: 8px; display: flex; align-items: center; cursor: pointer; transition: 0.2s;" onclick="window.openSanskritItem(${index})">
                    <i data-feather="${iconName}" style="margin-right: 12px; color: ${titleColor}; width: 16px; height: 16px; opacity: 0.9;"></i>
                    <div style="flex: 1; text-align: left; display: flex; align-items: center; justify-content: space-between;">
                        <span style="font-size: 13.5px; font-weight: ${fontWeight}; color: ${titleColor}; font-family: 'Inter', sans-serif; line-height: 1.3;">${item.title}</span>
                        ${badge}
                    </div>
                </div>
            `;
        });
        return html;
    };

    if (mainList) mainList.innerHTML = generateListHtml();
    if (playerList) playerList.innerHTML = generateListHtml();
    feather.replace();
}

window.openSanskritItem = (index) => {
    const data = APP_CONFIG.sanskrit[index];
    
    document.getElementById('sanskrit-landing-view').style.display = 'none';
    document.getElementById('sanskrit-player-view').style.display = 'block';
    
    const titleEl = document.getElementById('sanskrit-player-title');
    const badgeEl = document.getElementById('sanskrit-playlist-badge');
    const accContainer = document.getElementById('sanskrit-playlist-container');
    const accItems = document.getElementById('sanskrit-playlist-items');
    
    titleEl.innerText = data.title;
    initSanskritUI(index);
    
    if (data.type === 'playlist') {
        badgeEl.style.display = 'inline-block';
        titleEl.style.marginBottom = '10px';
        document.getElementById('sanskrit-iframe').src = `https://www.youtube.com/embed/videoseries?list=${data.id}&autoplay=1`;
        
        if(data.videos && data.videos.length > 0) {
            accContainer.style.display = 'block';
            let itemsHtml = '<div style="padding-top: 10px; display: flex; flex-direction: column; gap: 8px;">';
            data.videos.forEach((vid) => {
                itemsHtml += `
                    <div onclick="window.playSanskritSubVideo('${vid.id}', this)" class="sanskrit-playlist-row" style="padding: 12px; background: rgba(0,0,0,0.2); border-radius: 8px; cursor: pointer; color: white; font-size: 13px; display: flex; align-items: center; gap: 10px; font-family: 'Inter', sans-serif; transition: 0.2s;">
                        <i data-feather="play-circle" style="width: 14px; opacity: 0.7;"></i>
                        <span>${vid.title}</span>
                    </div>
                `;
            });
            itemsHtml += '</div>';
            accItems.innerHTML = itemsHtml;
            
            setTimeout(() => {
                const firstSubItem = accItems.querySelector('.sanskrit-playlist-row');
                if(firstSubItem) window.playSanskritSubVideo(data.videos[0].id, firstSubItem);
            }, 100);
        } else {
            accContainer.style.display = 'none';
            accItems.innerHTML = '';
        }

    } else {
        badgeEl.style.display = 'none';
        titleEl.style.marginBottom = '0px';
        accContainer.style.display = 'none';
        accItems.innerHTML = '';
        document.getElementById('sanskrit-iframe').src = `https://www.youtube.com/embed/${data.id}?autoplay=1`;
    }
    
    window.scrollTo({ top: 0, behavior: 'smooth' });
    
    setTimeout(() => {
        window.checkSanskritScroll();
        const listContainer = document.getElementById('sanskrit-player-list');
        const activeEl = document.querySelector('#sanskrit-player-list .sanskrit-list-item.active');
        
        if (activeEl && listContainer) {
            const scrollPos = activeEl.offsetTop - (listContainer.clientHeight / 2) + (activeEl.clientHeight / 2);
            listContainer.scrollTo({ top: scrollPos, behavior: 'smooth' });
        }
    }, 300);
    feather.replace();
}

window.playSanskritSubVideo = (vidId, el) => {
    document.getElementById('sanskrit-iframe').src = `https://www.youtube.com/embed/${vidId}?autoplay=1`;
    document.querySelectorAll('.sanskrit-playlist-row').forEach(item => {
        item.style.background = 'rgba(0,0,0,0.2)';
        item.style.color = 'white';
        item.style.fontWeight = 'normal';
        const icon = item.querySelector('i');
        if(icon) icon.style.color = 'white';
    });
    el.style.background = 'rgba(251, 191, 36, 0.1)';
    el.style.color = 'var(--gold)';
    el.style.fontWeight = '500';
    const icon = el.querySelector('i');
    if(icon) icon.style.color = 'var(--gold)';
}

window.toggleSanskritPlaylist = () => {
    const items = document.getElementById('sanskrit-playlist-items');
    const chevron = document.getElementById('sanskrit-playlist-chevron');
    if (items.style.maxHeight === '0px' || items.style.maxHeight === '') {
        items.style.maxHeight = '500px'; 
        chevron.setAttribute('data-feather', 'chevron-up');
    } else {
        items.style.maxHeight = '0px';
        chevron.setAttribute('data-feather', 'chevron-down');
    }
    feather.replace();
}

window.backToSanskritList = () => {
    document.getElementById('sanskrit-iframe').src = ''; 
    document.getElementById('sanskrit-player-view').style.display = 'none';
    document.getElementById('sanskrit-landing-view').style.display = 'block';
    initSanskritUI(null); 
}

window.checkSanskritScroll = () => {
    const list = document.getElementById('sanskrit-player-list');
    const upBtn = document.getElementById('sanskrit-scroll-up');
    const downBtn = document.getElementById('sanskrit-scroll-down');
    if(!list) return;

    if (list.scrollHeight > list.clientHeight) {
        upBtn.style.display = list.scrollTop > 5 ? 'flex' : 'none';
        downBtn.style.display = (list.scrollTop + list.clientHeight < list.scrollHeight - 5) ? 'flex' : 'none';
    } else {
        upBtn.style.display = 'none';
        downBtn.style.display = 'none';
    }
};

window.scrollSanskritList = (dir) => {
    const list = document.getElementById('sanskrit-player-list');
    if(!list) return;
    list.scrollBy({ top: 120 * dir, behavior: 'smooth' });
    setTimeout(window.checkSanskritScroll, 300); 
};

// --- REVIEW PANE LOGIC ---
function getRawAudioUrl(url) {
    if (!url || !url.includes("drive.google.com")) return url;
    const dMatch = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
    let fileId = dMatch ? dMatch[1] : null;
    if (!fileId && url.includes("id=")) {
        const idMatch = url.match(/id=([a-zA-Z0-9_-]+)/);
        fileId = idMatch ? idMatch[1] : null;
    }
    if (fileId) return `https://drive.google.com/uc?export=download&id=${fileId}`;
    return url;
}

async function loadReviews() {
    if (!db) return;
    document.getElementById('review-loading').style.display = 'block';
    document.getElementById('review-container').innerHTML = '';
    
    const userId = localStorage.getItem('vss_user_id');
    const role = localStorage.getItem('vss_user_role') || 'learner';
    
    try {
        let q = db.collection("shloka_logs");
        if (role !== 'admin' && role !== 'teacher') {
            q = q.where("User_ID", "==", userId);
        }
        
        const querySnapshot = await q.get();
        const logs = [];
        querySnapshot.forEach((doc) => logs.push(doc.data()));
        
        renderReviews(logs, role);
    } catch (e) {
        console.error(e);
        document.getElementById('review-loading').innerText = 'Error connecting to database.';
    }
}

function renderReviews(logs, role) {
    const container = document.getElementById('review-container');
    document.getElementById('review-loading').style.display = 'none';
    
    if (!logs || logs.length === 0) {
        container.innerHTML = '<p style="text-align: center; opacity: 0.6; font-size: 13px; font-family: Inter;">No recordings found.</p>';
        return;
    }

    logs.sort((a,b) => b.Timestamp - a.Timestamp);

    if (role === 'teacher' || role === 'admin') {
        const grouped = {};
        logs.forEach(l => {
            if(!grouped[l.Name]) grouped[l.Name] = [];
            grouped[l.Name].push(l);
        });
        
        let html = '';
        for (const [studentName, studentLogs] of Object.entries(grouped)) {
            let idSafe = studentName.replace(/\s+/g, '-').replace(/[^a-zA-Z0-9-]/g, '').toLowerCase();
            let pendingCount = studentLogs.filter(l => !l.Teacher_Feedback_Text && !l.Teacher_Audio_Link).length;
            let highlightStyle = pendingCount > 0 ? 'border: 1px solid #ff4757;' : 'border: 1px solid var(--border);';
            let pendingBadge = pendingCount > 0 ? `<span style="font-size: 11px; color: white; background: #ff4757; padding: 2px 6px; border-radius: 6px; margin-left: 8px;">${pendingCount} Pending</span>` : '';

            html += `
                <div style="margin-bottom: 10px; background: rgba(0,0,0,0.3); ${highlightStyle} border-radius: 12px; overflow: hidden;">
                    <button onclick="window.toggleReviewAccordion('${idSafe}')" style="width: 100%; background: rgba(255,255,255,0.05); padding: 15px; border: none; color: white; display: flex; justify-content: space-between; align-items: center; font-family: 'Inter', sans-serif; cursor: pointer; font-weight: 500;">
                        <span>${studentName} <span style="font-size: 11px; color: var(--gold); background: rgba(251,191,36,0.1); padding: 2px 6px; border-radius: 6px; margin-left: 8px;">${studentLogs.length} Total</span> ${pendingBadge}</span>
                        <i data-feather="chevron-down" id="chevron-${idSafe}" style="width: 16px; color: var(--gold);"></i>
                    </button>
                    <div id="acc-${idSafe}" style="max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out;">
                        <div style="padding: 15px;">
                            ${studentLogs.map(l => buildReviewItem(l, role)).join('')}
                        </div>
                    </div>
                </div>
            `;
        }
        container.innerHTML = html;
    } else {
        container.innerHTML = logs.map(l => buildReviewItem(l, role)).join('');
    }
    feather.replace();
}

function buildReviewItem(log, role) {
    let dateObj = new Date(log.Timestamp);
    let dateStr = dateObj.toLocaleDateString() + ' ' + dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    let teacherFeedbackHTML = '';
    let learnerActions = '';
    
    let audioSrc = getRawAudioUrl(log.Audio_Link);
    let teacherAudioSrc = getRawAudioUrl(log.Teacher_Audio_Link);
    
    let isPending = !log.Teacher_Feedback_Text && !log.Teacher_Audio_Link;

    if (role === 'teacher' || role === 'admin') {
        let pendingBorder = isPending ? 'border-left: 3px solid #ff4757;' : 'border-left: 3px solid transparent;';
        
        teacherFeedbackHTML = `
            <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--border); ${pendingBorder} padding-left: 10px;">
                <p style="font-size: 12px; color: var(--gold); margin-bottom: 5px;">Teacher Feedback</p>
                <textarea id="feedback-text-${log.Shloka_ID}" class="search-input" style="min-height: 60px; margin-bottom: 10px;" placeholder="Write feedback here...">${log.Teacher_Feedback_Text || ''}</textarea>
                
                ${log.Teacher_Audio_Link ? `
                    <div style="margin-bottom: 10px;">
                        <span style="font-size: 11px; opacity:0.7;">Previous Voice Note:</span><br>
                        <audio src="${teacherAudioSrc}" controls preload="metadata" style="width: 100%; height: 35px; border-radius: 8px;"></audio>
                    </div>` : ''}
                
                <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 10px;">
                    <button id="fb-record-btn-${log.Shloka_ID}" onclick="window.toggleFeedbackRecord('${log.Shloka_ID}')" style="background: rgba(255,255,255,0.1); border: 1px solid var(--border); color: white; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.3s;">
                        <i data-feather="mic" id="fb-record-icon-${log.Shloka_ID}" style="width: 16px;"></i>
                    </button>
                    <span id="fb-record-timer-${log.Shloka_ID}" style="font-family: monospace; font-size: 16px; color: var(--gold);">00:00</span>
                </div>
                <audio id="fb-audio-preview-${log.Shloka_ID}" controls style="width: 100%; display: none; height: 35px; border-radius: 8px; margin-bottom: 10px;"></audio>
                
                <button id="fb-submit-btn-${log.Shloka_ID}" onclick="window.submitFeedback('${log.Shloka_ID}')" style="width: 100%; background: linear-gradient(135deg, var(--gold), #d97706); border: none; color: var(--bg); padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px;">Save Feedback</button>
                <div id="fb-status-${log.Shloka_ID}" style="font-size: 12px; color: var(--gold); margin-top: 5px;"></div>
            </div>
        `;
    } else {
        learnerActions = `
            <div style="margin-top: 15px; display: flex; gap: 10px;">
                <button onclick="window.deleteRecording('${log.Shloka_ID}')" style="background: rgba(255, 71, 87, 0.1); border: 1px solid #ff4757; color: #ff4757; padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 5px; font-weight: 500;"><i data-feather="trash-2" style="width: 14px;"></i> Delete</button>
                <button onclick="showTab('sadhana')" style="background: rgba(251, 191, 36, 0.1); border: 1px solid var(--gold); color: var(--gold); padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 5px; font-weight: 500;"><i data-feather="mic" style="width: 14px;"></i> Re-Record</button>
            </div>
        `;
        
        if(!isPending) {
            teacherFeedbackHTML = `
                <div style="margin-top: 15px; padding: 15px; background: rgba(251, 191, 36, 0.08); border-left: 2px solid var(--gold); border-radius: 8px;">
                    <p style="font-size: 12px; color: var(--gold); margin-bottom: 5px; font-weight: bold;">Teacher Review</p>
                    ${log.Teacher_Feedback_Text ? `<p style="font-size: 13px; color: white; margin-bottom: 10px; line-height: 1.5;">${log.Teacher_Feedback_Text}</p>` : ''}
                    ${log.Teacher_Audio_Link ? `<audio src="${teacherAudioSrc}" controls preload="metadata" style="width: 100%; height: 35px; border-radius: 8px;"></audio>` : ''}
                </div>
            `;
        } else {
            teacherFeedbackHTML = `
                <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--border);">
                    <p style="font-size: 12px; color: rgba(255,255,255,0.4); font-style: italic;">Review pending...</p>
                </div>
            `;
        }
    }

    return `
        <div id="review-item-${log.Shloka_ID}" style="padding: 15px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; margin-bottom: 15px; text-align: left; transition: opacity 0.3s;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                <span style="font-weight: bold; color: var(--gold); font-size: 14px;">${log.Shloka_num}</span>
                <span style="font-size: 11px; opacity: 0.6;">${dateStr}</span>
            </div>
            <span style="font-size: 11px; opacity: 0.7; margin-bottom: 5px; display: block;">Learner Audio:</span>
            <audio src="${audioSrc}" controls preload="metadata" style="width: 100%; height: 35px; border-radius: 8px;"></audio>
            
            ${learnerActions}
            ${teacherFeedbackHTML}
        </div>
    `;
}

window.toggleReviewAccordion = (id) => {
    const items = document.getElementById('acc-' + id);
    const chevron = document.getElementById('chevron-' + id);
    if (items.style.maxHeight === '0px' || items.style.maxHeight === '') {
        items.style.maxHeight = '2000px'; 
        chevron.setAttribute('data-feather', 'chevron-up');
    } else {
        items.style.maxHeight = '0px';
        chevron.setAttribute('data-feather', 'chevron-down');
    }
    feather.replace();
};

window.feedbackBlob = null;
window.feedbackMediaRecorder = null;
window.feedbackAudioChunks = [];
window.activeFeedbackId = null;
window.feedbackTimerInterval = null;
window.feedbackSeconds = 0;

window.toggleFeedbackRecord = (shlokaId) => {
    if (window.activeFeedbackId && window.activeFeedbackId !== shlokaId) {
        alert("Please finish or stop the current recording first.");
        return;
    }

    const btn = document.getElementById(`fb-record-btn-${shlokaId}`);
    const icon = document.getElementById(`fb-record-icon-${shlokaId}`);
    const timer = document.getElementById(`fb-record-timer-${shlokaId}`);
    const preview = document.getElementById(`fb-audio-preview-${shlokaId}`);

    if (!window.feedbackMediaRecorder || window.feedbackMediaRecorder.state === "inactive") {
        navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
            window.activeFeedbackId = shlokaId;
            window.feedbackMediaRecorder = new MediaRecorder(stream);
            window.feedbackAudioChunks = [];

            window.feedbackMediaRecorder.ondataavailable = e => {
                if (e.data.size > 0) window.feedbackAudioChunks.push(e.data);
            };

            window.feedbackMediaRecorder.onstop = () => {
                window.feedbackBlob = new Blob(window.feedbackAudioChunks, { type: window.feedbackMediaRecorder.mimeType || 'audio/webm' });
                preview.src = URL.createObjectURL(window.feedbackBlob);
                preview.style.display = 'block';
                stream.getTracks().forEach(t => t.stop());
                window.activeFeedbackId = null;
            };

            window.feedbackMediaRecorder.start();
            
            btn.style.background = '#ff4757';
            btn.style.borderColor = '#ff4757';
            icon.setAttribute('data-feather', 'square');
            feather.replace();
            preview.style.display = 'none';
            
            window.feedbackSeconds = 0;
            timer.innerText = "00:00";
            window.feedbackTimerInterval = setInterval(() => {
                window.feedbackSeconds++;
                let m = Math.floor(window.feedbackSeconds / 60).toString().padStart(2, '0');
                let s = (window.feedbackSeconds % 60).toString().padStart(2, '0');
                timer.innerText = `${m}:${s}`;
            }, 1000);
        }).catch(e => alert("Microphone access denied."));
    } else {
        window.feedbackMediaRecorder.stop();
        clearInterval(window.feedbackTimerInterval);
        btn.style.background = 'rgba(255,255,255,0.1)';
        btn.style.borderColor = 'var(--border)';
        icon.setAttribute('data-feather', 'mic');
        feather.replace();
    }
};

window.submitFeedback = async (shlokaId) => {
    const text = document.getElementById(`feedback-text-${shlokaId}`).value;
    const status = document.getElementById(`fb-status-${shlokaId}`);
    const submitBtn = document.getElementById(`fb-submit-btn-${shlokaId}`);

    if (!text && !window.feedbackBlob) {
        status.innerText = "Please provide text or audio feedback.";
        return;
    }

    submitBtn.disabled = true;
    submitBtn.innerText = "Saving...";
    status.innerText = "Uploading to database...";
    
    let fbAudioDataUrl = "";
    
    try {
        if(!db) throw new Error("Firestore not ready");

        if (window.feedbackBlob) {
            fbAudioDataUrl = await new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(window.feedbackBlob);
                reader.onloadend = () => resolve(reader.result);
            });
        }

        const updateData = { Teacher_Feedback_Text: text };
        if (fbAudioDataUrl) updateData.Teacher_Audio_Link = fbAudioDataUrl;
        
        await db.collection("shloka_logs").doc(shlokaId).update(updateData);

        status.innerText = "✅ Feedback Saved!";
        status.style.color = "#2ed573";
        window.feedbackBlob = null;
        setTimeout(() => { submitBtn.innerText = "Save Feedback"; submitBtn.disabled = false; loadReviews(); }, 1500);
    } catch (e) {
        status.innerText = "Error saving feedback.";
        status.style.color = "#ff4757";
        submitBtn.disabled = false;
        submitBtn.innerText = "Save Feedback";
    }
};

window.deleteRecording = async (shlokaId) => {
    if(!confirm("Are you sure you want to delete this recording?")) return;
    
    document.getElementById(`review-item-${shlokaId}`).style.opacity = '0.4';
    
    try {
        if(!db) throw new Error("Firestore not ready");
        await db.collection("shloka_logs").doc(shlokaId).delete();
        loadReviews(); 
    } catch (e) {
        alert("Failed to delete recording. Check connection.");
        document.getElementById(`review-item-${shlokaId}`).style.opacity = '1';
    }
};

function toggleAudioPlay() {
    const audio = document.getElementById('sadhana-bg-audio');
    const icon = document.getElementById('audio-play-icon');
    if (!audio.src || audio.src.endsWith('undefined')) audio.src = "./meditations/vss.mp3";

    if (audio.paused) {
        audio.play().then(() => {
            icon.setAttribute('data-feather', 'pause'); feather.replace();
        }).catch(e => { console.log("Audio play blocked.", e); });
    } else {
        audio.pause();
        icon.setAttribute('data-feather', 'play'); feather.replace();
    }
}
