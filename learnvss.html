<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
	<link rel="manifest" href="manifest.json">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1e3a8a">
    <meta name="apple-mobile-web-app-title" content="Learn VSS">
    <link rel="apple-touch-icon" href="../assets/logo.webp">
	
    <title>Vedic Space | Learn VSS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons" defer></script>
    <script src='https://8x8.vc/vpaas-magic-cookie-47ba1aabdd84458d9977951213e7d9f0/external_api.js' async></script>

    <style>
        :root { --bg: #1e3a8a; --gold: #fbbf24; --glass: rgba(255, 255, 255, 0.07); --border: rgba(251, 191, 36, 0.2); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; padding-bottom: 90px; }
        body.chat-open { overflow: hidden; } 
        
        .serif { font-family: 'Playfair Display', serif; }
        
        .header { position: sticky; top: 0; background: rgba(30, 58, 138, 0.9); backdrop-filter: blur(10px); padding: 15px 20px; border-bottom: 1px solid var(--border); z-index: 100; }
        .nav-links { display: none; gap: 25px; list-style: none; margin: 0; padding: 0; align-items: center; }
        .nav-links a { color: white; text-decoration: none; font-weight: 500; font-size: 13px; text-transform: uppercase; letter-spacing: 0.1em; transition: color 0.3s; cursor: pointer; }
        .nav-links a:hover, .nav-links a.active-link { color: var(--gold); }
        
        .content { padding: 10px; max-width: 800px; margin: auto; padding-left: env(safe-area-inset-left, 10px); padding-right: env(safe-area-inset-right, 10px); }
        .view { display: none; }
        .view.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .search-input { width: 100%; background: var(--glass); border: 1px solid var(--border); border-radius: 12px; padding: 12px 15px; color: white; font-size: 14px; outline: none; transition: border 0.3s; font-family: inherit; resize: vertical; box-sizing: border-box; }
        .search-input:focus { border-color: var(--gold); }
        
        .card { background: var(--glass); border: 1px solid var(--border); border-radius: 20px; overflow: hidden; margin-bottom: 20px; padding: 20px; }
        .card-body { padding: 15px; text-align: center; }
        .video-box { position: relative; padding-bottom: 56.25%; height: 0; background: #000; }
        .video-box iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

        .interactive-picker { background: var(--glass); border: 1px solid var(--border); border-radius: 15px; margin-bottom: 20px; overflow: hidden; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .picker-search-bar { display: flex; align-items: center; padding: 14px 15px; gap: 10px; background: rgba(0,0,0,0.2); position: relative; z-index: 2; }
        .picker-search-bar input { flex: 1; background: transparent; border: none; color: var(--gold); font-size: 15px; font-weight: 600; outline: none; font-family: 'Inter', sans-serif; text-overflow: ellipsis; }
        .picker-search-bar input::placeholder { color: rgba(255,255,255,0.6); font-weight: 400; }
        .picker-wheel-area { height: 0; position: relative; transition: height 0.3s cubic-bezier(0.4, 0, 0.2, 1); opacity: 0; overflow: hidden; }
        .interactive-picker.expanded .picker-wheel-area, .inline-dropdown.expanded .picker-wheel-area { height: 150px; opacity: 1; }
        .picker-wheel { height: 100%; overflow-y: auto; scroll-snap-type: y mandatory; scrollbar-width: none; }
        .picker-wheel::-webkit-scrollbar { display: none; }
        .wheel-pad { height: 55px; } 
        .wheel-item { height: 40px; display: flex; align-items: center; justify-content: center; scroll-snap-align: center; font-size: 15px; color: white; opacity: 0.4; transition: all 0.2s; cursor: pointer; text-align: center; padding: 0 20px; font-family: 'Inter', sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .wheel-item.active { opacity: 1; color: var(--gold); font-weight: bold; transform: scale(1.08); }
        .picker-highlight { position: absolute; top: 55px; left: 15px; right: 15px; height: 40px; border-top: 1px solid var(--gold); border-bottom: 1px solid var(--gold); background: rgba(251, 191, 36, 0.1); border-radius: 8px; pointer-events: none; z-index: 1; }
        
        @keyframes scaleIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
        .media-display { animation: scaleIn 0.4s ease; transform-origin: top center; }

        .mode-toggle { display: flex; background: var(--glass); border-radius: 12px; padding: 2px; border: 1px solid var(--border); height: 40px; min-width: 140px; }
        .mode-btn { flex: 1; border: none; background: transparent; color: white; border-radius: 8px; cursor: pointer; font-size: 10px; transition: 0.3s; padding: 0 4px; line-height: 1.2; font-family: 'Inter', sans-serif;}
        .mode-btn.active { background: var(--gold); color: var(--bg); font-weight: bold; }

        #jaas-container { width: 100%; height: 60vh; border-radius: 15px; overflow: hidden; background: #000; }

        #sadhana-container:fullscreen { background: var(--bg) !important; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 0; width: 100vw; height: 100vh; }
        #sadhana-container:fullscreen .slide-wrapper { width: 100vw; height: 100vh; max-height: 100vh; aspect-ratio: auto; border-radius: 0; }
        
        #sadhana-container .slide-wrapper { width: 100%; height: auto; aspect-ratio: 16/9; max-height: 75vh; border-radius: 12px; overflow: hidden; }
        #sadhana-container img#sadhana-slide { object-fit: contain; width: 100%; height: 100%; }

        @media screen and (max-height: 500px) and (orientation: landscape) {
            #sadhana-container:fullscreen .flow-controls {
                position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); width: auto; max-width: 95%;
                background: rgba(0, 0, 0, 0.65); border-radius: 50px; padding: 8px 15px !important;
                backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.2);
                display: flex !important; flex-direction: row !important; align-items: center !important; justify-content: center !important; gap: 12px !important; margin-top: 0 !important; z-index: 200;
            }
            #sadhana-container .flow-controls > div { flex-shrink: 0; }
            #sadhana-container:fullscreen .vss-heading-img { display: none !important; }
        }

        .yajna-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--bg); z-index: 2000; display: none; flex-direction: column; opacity: 0; transition: opacity 0.3s ease; overflow: hidden;}
        .yajna-overlay.active { display: flex; opacity: 1; }
        .yajna-header { display: flex; justify-content: space-between; align-items: center; padding: 20px; background: rgba(0,0,0,0.2); border-bottom: 1px solid var(--border); padding-top: max(20px, env(safe-area-inset-top)); }
        .yajna-content-area { flex: 1; overflow-y: auto; padding: 25px 20px; font-size: 16px; line-height: 1.8; color: white; text-align: left; padding-bottom: 120px; font-family: 'Inter', sans-serif; }

        @media (min-width: 768px) {
            .mobile-nav-wrapper { display: none !important; }
            .nav-links { display: flex !important; }
            body { padding-bottom: 20px; }
            .yajna-content-area { padding: 40px 10%; font-size: 18px; }
        }

        .mobile-nav-wrapper { position: fixed; bottom: 0; left: 0; width: 100%; background: #1e3a8a; border-top: 1px solid var(--border); z-index: 1000; overflow: hidden; padding-bottom: env(safe-area-inset-bottom, 0); }
        .mobile-nav { display: flex; align-items: center; width: 100%; overflow-x: auto; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; scroll-snap-type: x mandatory; scrollbar-width: none; }
        .mobile-nav::-webkit-scrollbar { display: none; } 
        .nav-item { flex: 0 0 20%; scroll-snap-align: start; color: white; opacity: 0.5; display: flex; flex-direction: column; align-items: center; font-size: 10px; cursor: pointer; padding: 12px 0; transition: 0.3s ease; font-family: 'Inter', sans-serif; }
        .nav-item.active { opacity: 1; color: var(--gold); transform: scale(1.05); }
        .nav-item i { width: 24px; height: 24px; } 

        .nav-arrow { position: absolute; top: 0; height: 100%; width: 45px; background: transparent; border: none; color: var(--gold); cursor: pointer; z-index: 10; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease; pointer-events: none; }
        .mobile-nav-wrapper:hover .nav-arrow { opacity: 1; pointer-events: auto; }
        .left-arrow { left: 0; background: linear-gradient(to right, rgba(30,58,138,1) 40%, rgba(30,58,138,0)); }
        .right-arrow { right: 0; background: linear-gradient(to left, rgba(30,58,138,1) 40%, rgba(30,58,138,0)); }
        @media (hover: none) { .nav-arrow { opacity: 0.8; width: 35px; pointer-events: auto; } }

    </style>
</head>
<body onkeydown="handleKeys(event)">

<header class="header">
    <div style="width: 100%; max-width: 1200px; margin: auto; display: flex; justify-content: space-between; align-items: center;">
        <a href="#" class="logo serif" style="display: flex; align-items: center; gap: 10px; color: white; text-decoration: none; font-size: 24px; font-weight: 600;">
            <img src="../assets/logo.webp" alt="Vedic Space" style="height: 40px;">
            Vedic Space
        </a>
        <ul class="nav-links" id="desktop-nav-container"></ul>
        <div style="display: flex; align-items: center;">
            <i data-feather="user" onclick="window.location.href='login.html'" style="cursor: pointer;"></i>
        </div>
    </div>
</header>

<div class="content" id="app-content-container"></div>

<div class="mobile-nav-wrapper">
    <button class="nav-arrow left-arrow" onclick="scrollNav(-1)"><i data-feather="chevron-left"></i></button>
    <nav class="mobile-nav" id="main-nav"></nav>
    <button class="nav-arrow right-arrow" onclick="scrollNav(1)"><i data-feather="chevron-right"></i></button>
</div>

<div id="yajna-overlay" class="yajna-overlay">
    <div class="yajna-header">
        <h3 class="serif" style="color: var(--gold); margin: 0; font-size: 1.2rem;">What is Yajna?</h3>
        <i data-feather="x" style="cursor: pointer; color: white;" onclick="closeYajnaOverlay()"></i>
    </div>
    <div id="yajna-content" class="yajna-content-area serif">Loading wisdom...</div>
    <div style="position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); padding: 10px 20px; border-radius: 30px; border: 1px solid var(--border); display: flex; align-items: center; gap: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
        <button onclick="toggleYajnaAudio()" id="yajna-audio-btn" style="background: var(--gold); border: none; color: var(--bg); border-radius: 50%; width: 45px; height: 45px; cursor: pointer; display: flex; justify-content: center; align-items: center;">
            <i data-feather="play" id="yajna-audio-icon" style="margin-left: 2px;"></i>
        </button>
        <span style="font-family: 'Inter', sans-serif; font-size: 12px; opacity: 0.8;">Listen to Gurudev</span>
    </div>
</div>

<script>
// --- CONFIGURATION ENGINE ---
let APP_CONFIG = null;

// SLIDER VARIABLES
let pIdx = 1;

const FALLBACK_CONFIG = {
    settings: { enableShruti: false, googleSheetUrl: 'https://script.google.com/macros/s/AKfycbxS3fA7rBNW1191FZyGWhIbFAuNh-36uFyEyAaVdDsfZotELuHVn39wGcmZlUhJekLL/exec', meditationBellUrl: './assets/taala.mp3' },
    navigation: [
        {id:'sadhana', title:'Learn VSS', icon:'refresh-cw', enabled:true},
        {id:'pran', title:'Prāṇa', icon:'loader', enabled:true}, 
        {id:'med', title:'Dhyāna', icon:'moon', enabled:true}, 
        {id:'anubhava', title:'Anubhava', icon:'edit-3', enabled:true}, 
        {id:'yajna', title:'Yajna', icon:'video', enabled:true},
        {id:'drop', title:'Arpanam', icon:'wind', enabled:true}
    ],
    meditations: [
        {title:"Hari Om Meditation","audio":"./meditations/hari_om_meditation.mp3","img":"./meditations/Hari_Om_Chakras.webp"}, {title:"Om Namah Shivaya","audio":"./meditations/om_namah_shivaya.mp3","img":"./meditations/Om_Namah_Shivaya.webp"},
        {title:"Samarpan Meditation","audio":"./meditations/samarpan.mp3","img":"./meditations/Samarpan.webp"}
    ],
    pranayamas: [
        {title:"Bhastrika Pranayama","video":"https://www.youtube.com/embed/iAlojRS6iBM"}, {title:"Ujjayi Breathing","video":"https://www.youtube.com/embed/IQrsJ-yZWV8"}
    ]
};

async function loadConfig() {
    try {
        const response = await fetch('./app_config/learnvss_config.json');
        if (response.ok) APP_CONFIG = await response.json();
        else throw new Error("Config not found");
    } catch (e) { APP_CONFIG = FALLBACK_CONFIG; }

    initDynamicUI();
}

function initDynamicUI() {
    const dNav = document.getElementById('desktop-nav-container');
    const mNav = document.getElementById('main-nav');
    const contentContainer = document.getElementById('app-content-container');
    
    dNav.innerHTML = ''; mNav.innerHTML = ''; contentContainer.innerHTML = '';
    
    // Filter out disabled items, and enforce ignoring of mandala, learn, sangha
    APP_CONFIG.navigation.filter(item => item.enabled !== false && !['mandala', 'learn', 'sangha'].includes(item.id)).forEach(item => {
        dNav.innerHTML += `<li><a onclick="showTab('${item.id}')" id="t-${item.id}">${item.id === 'drop' ? 'Arpanam' : item.title}</a></li>`;
        mNav.innerHTML += `<div class="nav-item" onclick="showTab('${item.id}')" id="n-${item.id}"><i data-feather="${item.icon}"></i><span style="margin-top: 4px; font-family:'Inter', sans-serif;">${item.id === 'drop' ? 'Arpanam' : item.title}</span></div>`;
        contentContainer.innerHTML += getPaneHTML(item.id);
    });

    feather.replace();
    const firstPane = APP_CONFIG.navigation.find(item => item.enabled !== false && !['mandala', 'learn', 'sangha'].includes(item.id));
    if(firstPane) showTab(firstPane.id); 
    bindTouchEvents();
}

function getPaneHTML(id) {
    if(id === 'anubhava') return `
        <section id="v-anubhava" class="view">
            <div class="card" style="padding: 25px 20px; text-align: center;">
                <h3 class="serif" style="color: var(--gold); margin-bottom: 10px; font-size: 1.4rem;">Share your Anubhava</h3>
                <p style="font-size: 13px; opacity: 0.8; margin-bottom: 25px; font-family:'Inter',sans-serif;">Share your on-going experiences, learnings, realisations with the group.</p>
                <textarea id="anubhava-observations" class="search-input" style="min-height: 160px; padding: 15px; line-height: 1.5; box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);" placeholder="Log any spiritual experiences, deep observations, or passing thoughts..."></textarea>
                <button onclick="logAnubhavaSnapshot()" style="width: 100%; margin-top: 20px; background: linear-gradient(135deg, var(--gold), #d97706); border: none; color: var(--bg); padding: 16px; border-radius: 12px; font-weight: bold; font-size: 14px; cursor: pointer; box-shadow: 0 4px 15px rgba(251, 191, 36, 0.3); transition: transform 0.2s; font-family:'Inter',sans-serif;">Record Anubhava</button>
                <div style="display: flex; gap: 10px; margin-top: 15px;">
                    <button onclick="exportAnubhavaLogs()" style="flex: 1; background: rgba(255,255,255,0.1); border: 1px solid var(--border); color: white; padding: 12px; border-radius: 12px; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; transition: 0.3s;"><i data-feather="download" style="width: 14px;"></i> Export</button>
                    <button onclick="shareAnubhavaLogs('whatsapp')" style="flex: 1; background: #25D366; border: none; color: white; padding: 12px; border-radius: 12px; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; transition: 0.3s;"><i data-feather="message-circle" style="width: 14px;"></i> WhatsApp</button>
                    <button onclick="shareAnubhavaLogs('email')" style="flex: 1; background: #1e3a8a; border: 1px solid #3b82f6; color: white; padding: 12px; border-radius: 12px; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; transition: 0.3s;"><i data-feather="mail" style="width: 14px;"></i> Email</button>
                </div>
            </div>
        </section>`;
        
    if(id === 'sadhana') return `
        <section id="v-sadhana" class="view">
            <div id="sadhana-container" class="card" style="padding: 20px 10px; text-align: center; position: relative; border: none; background: transparent;">
                <div class="vss-heading-img">
                    <h3 class="serif" style="color: var(--gold); margin: 0 0 15px 0;">श्री विष्णु सहस्रनाम स्तोत्रम्</h3>
                    <img src="./assets/shri_vishnu.png" alt="Shri Vishnu" style="width: 180px; height: auto; object-fit: contain; margin: 0 auto 20px auto; display: block;">
                </div>
                
                <button onclick="toggleFS()" class="fs-btn" style="position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.3); border: 1px solid var(--border); color: white; padding: 8px; border-radius: 8px; z-index: 100; cursor: pointer;"><i data-feather="maximize" id="fs-icon" style="width: 18px; height: 18px;"></i></button>
                
                <div class="slide-wrapper" id="swipe-zone" style="position: relative; display: block; overflow: hidden; touch-action: pan-y; cursor: pointer; margin: auto;">
                    <img id="sadhana-slide" src="./parayana/Slide1.webp" style="display: block; pointer-events: none;">
                    <button onclick="navSlide(-1)" style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.15); border: none; color: white; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; z-index: 10;"><i data-feather="chevron-left"></i></button>
                    <button onclick="navSlide(1)" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.15); border: none; color: white; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; z-index: 10;"><i data-feather="chevron-right"></i></button>
                </div>
                
                <div class="flow-controls" style="margin-top: 15px; display: flex; align-items: center; justify-content: center; gap: 20px; z-index: 100; flex-wrap: wrap; padding: 10px; transition: all 0.3s ease;">
                    <div style="position: relative; width: 40px; height: 40px; flex-shrink: 0;" onclick="toggleAudioPlay()">
                        <svg width="40" height="40">
                            <circle cx="20" cy="20" r="18" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="3"/>
                            <circle cx="20" cy="20" r="18" style="stroke-width: 3; fill: none; stroke: var(--gold);"/>
                        </svg>
                        <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:var(--gold); cursor: pointer;">
                            <i data-feather="play" id="audio-play-icon" style="width: 16px;"></i>
                        </div>
                    </div>
                    
                    <div style="display: flex; align-items: center; gap: 5px; background: var(--glass); padding: 4px 10px; border-radius: 20px; border: 1px solid var(--border); backdrop-filter: blur(5px); height: 40px;">
                        <button onclick="toggleAudioMute()" style="background:none; border:none; color:var(--gold); cursor:pointer; display:flex; align-items:center;">
                            <i id="audio-icon" data-feather="volume-2" style="width: 16px;"></i>
                        </button>
                        <input type="range" id="sadhana-volume" min="0" max="1" step="0.01" value="1" oninput="setSadhanaVolume(this.value)" style="width: 60px; height: 4px; -webkit-appearance: none; background: rgba(255,255,255,0.2); border-radius: 2px;">
                    </div>
                </div>
                <audio id="sadhana-bg-audio" preload="auto"></audio>
            </div>
        </section>`;

    if(id === 'drop') return `
        <section id="v-drop" class="view">
            <div class="card" style="padding: 30px 20px; text-align: center;">
                <h2 class="serif" style="color: var(--gold); margin-bottom: 10px;">Arpanam</h2>
                <h3 class="serif" style="font-size: 16px; opacity: 0.9; margin-bottom: 20px; font-weight: normal; color: white;">Drop your botherations..</h3>
                
                <textarea id="botheration-input" class="search-input" style="min-height: 120px; margin-bottom: 20px; font-size: 15px; padding: 15px; box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);" placeholder="Offer your thoughts, actions, or worries to the Divine..."></textarea>
                <button onclick="dropBotheration()" style="width: 100%; background: linear-gradient(135deg, #1e3a8a, var(--gold)); border: 1px solid var(--gold); color: white; padding: 16px; border-radius: 12px; font-weight: bold; font-size: 15px; cursor: pointer; box-shadow: 0 4px 15px rgba(251, 191, 36, 0.2); transition: transform 0.2s; display: flex; justify-content: center; align-items: center; gap: 10px; font-family:'Inter',sans-serif;"><i data-feather="sun"></i> Offer to Divine</button>
                <div id="drop-success-msg" style="opacity: 0; color: var(--gold); font-size: 14px; font-style: italic; margin-top: 20px; transition: opacity 0.5s;">Offered to the Divine...</div>
                
                <div style="margin-top: 30px; padding-top: 30px; border-top: 1px solid rgba(255,255,255,0.1);">
                    <img src="./assets/gita_9_27.png" alt="Gita 9.27" onerror="this.style.display='none'" style="width:100%; max-width: 320px; border-radius: 12px; border: 1px solid var(--border); margin: 0 auto 15px auto; display: block;">
                    <p style="font-size: 14px; line-height: 1.6; opacity: 0.9; margin-bottom: 0; font-family:'Inter',sans-serif; color: var(--gold); font-weight: 500;">"Whatever you do, whatever you eat, whatever you offer as oblation to the sacred fire, whatever you bestow as a gift, and whatever austerities you perform, O son of Kunti, do them as an offering to Me."</p>
                </div>
            </div>
        </section>`;

    if(id === 'pran') return `
        <section id="v-pran" class="view">
            <div class="interactive-picker" id="picker-pran">
                <div class="picker-search-bar">
                    <i data-feather="search" style="width: 16px; color: var(--gold);"></i>
                    <input type="text" id="input-pran" placeholder="Choose pranayama..." onfocus="expandPicker('pran')" oninput="filterPicker('pran')">
                    <i data-feather="x" onclick="clearPranSelection()" style="cursor:pointer; color: rgba(255,255,255,0.4); margin-right: 5px; width: 16px;"></i>
                    <i data-feather="chevron-down" id="chevron-pran" onclick="togglePicker('pran')" style="cursor:pointer; color: var(--gold);"></i>
                </div>
                <div class="picker-wheel-area"><div class="picker-highlight"></div><div class="picker-wheel" id="wheel-pran" onscroll="handleWheelScroll('pran')"></div></div>

// --- STATE LOGIC ---
let anubhavaStore = JSON.parse(localStorage.getItem('vss_anubhava_logs')) || {};

function logAnubhavaSnapshot() {
    const today = new Date().toISOString().split('T')[0];
    const obsText = document.getElementById('anubhava-observations').value || "";
    
    if(!obsText.trim()) {
        alert("Please write something to share your Anubhava.");
        return;
    }

    const snapshot = {
        userId: localStorage.getItem('vss_user_id') || 'guest_user',
        userName: localStorage.getItem('vss_user_name') || 'guest_user',
        date: today,
        time: new Date().toLocaleTimeString(),
        timestamp: new Date().getTime(),
        obs: obsText
    };

    if (!anubhavaStore[today]) anubhavaStore[today] = [];
    anubhavaStore[today].push(snapshot);
    localStorage.setItem('vss_anubhava_logs', JSON.stringify(anubhavaStore));
    
    let fetchUrl = APP_CONFIG.settings.googleSheetUrl;
    fetchUrl += `?obs=${encodeURIComponent(obsText)}`;

    fetch(fetchUrl, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(snapshot)
    }).catch(error => console.error("Cloud sync failed:", error));

    alert("Anubhava successfully recorded and shared!");
    document.getElementById('anubhava-observations').value = "";
}

function exportAnubhavaLogs() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(anubhavaStore, null, 2));

let pranTotalSecs = 5 * 60;
let pranSecsLeft = 5 * 60;
let pranTimerRunning = false;
let pranTimerInterval;

function updatePranTimerDisplay() {
    let m = Math.floor(pranSecsLeft / 60);
    let s = pranSecsLeft % 60;
    const display = document.getElementById('pran-timer-display');
    if (display) display.innerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    
    let ring = document.getElementById('pran-timer-ring');
    if (ring) {
        let progress = pranSecsLeft / pranTotalSecs;
        ring.style.strokeDashoffset = 282.7 * (1 - progress);
    }
}

function adjPranTimer(mins) {
    if (pranTimerRunning) return;
    let newMins = Math.floor(pranTotalSecs / 60) + mins;
    if (newMins < 1) newMins = 1;
    if (newMins > 120) newMins = 120;
    pranTotalSecs = newMins * 60;
    pranSecsLeft = pranTotalSecs;
    updatePranTimerDisplay();
}

function togglePranTimer() {
    pranTimerRunning = !pranTimerRunning;
    let btn = document.getElementById('pran-timer-btn');
    let bell = document.getElementById('pran-bell');
    
    if (pranTimerRunning) {
        if(bell) bell.load(); 
        btn.innerHTML = '<i data-feather="square" style="width: 20px; height: 20px; fill: white;"></i>'; 
        feather.replace();
        pranTimerInterval = setInterval(() => {
            pranSecsLeft--;

                clearInterval(pranTimerInterval);
                pranTimerRunning = false;
                pranSecsLeft = pranTotalSecs; 
                updatePranTimerDisplay();
                if(bell) bell.play().catch(e => console.log(e));

                feather.replace();

                updatePranTimerDisplay();
            }
        }, 1000);

        clearInterval(pranTimerInterval);
        if(bell) { bell.pause(); bell.currentTime = 0; }
        pranSecsLeft = pranTotalSecs; 
        updatePranTimerDisplay();
        btn.innerHTML = '<i data-feather="play" style="width: 26px; height: 26px; margin-left: 3px;"></i>';

function togglePicker(type) {
    const picker = document.getElementById(`picker-${type}`);
    const inlinePicker = document.getElementById(`${type}-section-inline`);
    const activeEl = inlinePicker || picker;
    
    if (activeEl && activeEl.querySelector('.picker-wheel-area').style.height === '150px' || (picker && picker.classList.contains('expanded'))) {
        collapsePicker(type);
    } else {
        expandPicker(type);
    }
}

function expandPicker(type) {
    const picker = document.getElementById(`picker-${type}`);
    const input = document.getElementById(`input-${type}`);
    
    if(picker) picker.classList.add('expanded');
    
    const inlineWheel = document.getElementById(`wheel-${type}`);
    if(inlineWheel && inlineWheel.parentElement.classList.contains('inline-dropdown')) {
        inlineWheel.parentElement.style.height = '150px';
        inlineWheel.parentElement.style.opacity = '1';
    }
    
    document.getElementById(`chevron-${type}`).setAttribute('data-feather', 'chevron-up');
    feather.replace();
    
    input.placeholder = input.value || (type.includes('med') ? `Choose meditation...` : `Search...`);
    input.value = '';
    filterPicker(type); 
    
    setTimeout(() => handleWheelScroll(type, true), 50);
}

function collapsePicker(type) {
    const picker = document.getElementById(`picker-${type}`);
    if(picker) picker.classList.remove('expanded');
    
    const inlineWheel = document.getElementById(`wheel-${type}`);
    if(inlineWheel && inlineWheel.parentElement.classList.contains('inline-dropdown')) {
        inlineWheel.parentElement.style.height = '0';
        inlineWheel.parentElement.style.opacity = '0';
    }
    
    document.getElementById(`chevron-${type}`).setAttribute('data-feather', 'chevron-down');
    feather.replace();
}

function filterPicker(type) {
    const sourceData = type === 'pran' ? APP_CONFIG.pranayamas : APP_CONFIG.meditations;
    const input = document.getElementById(`input-${type}`);
    const query = input.value.toLowerCase();
    const filtered = sourceData.filter(item => item.title.toLowerCase().includes(query));
    renderWheelItems(type, filtered);
}

function renderWheelItems(type, items) {
    const sourceData = type === 'pran' ? APP_CONFIG.pranayamas : APP_CONFIG.meditations;
    const wheel = document.getElementById(`wheel-${type}`);
    const innerHTML = items.map(item => {
        const origIdx = sourceData.indexOf(item);
        return `<div class="wheel-item" data-orig-idx="${origIdx}" onclick="selectFromWheel('${type}', ${origIdx})">${item.title}</div>`;
    }).join('');
    
    wheel.innerHTML = `<div class="wheel-pad"></div>${innerHTML}<div class="wheel-pad"></div>`;
    wheel.scrollTop = 0;
    handleWheelScroll(type, true);
}

function handleWheelScroll(type, preventRender = false) {
    const sourceData = type === 'pran' ? APP_CONFIG.pranayamas : APP_CONFIG.meditations;
    const wheel = document.getElementById(`wheel-${type}`);
    const items = wheel.querySelectorAll('.wheel-item');
    const wheelCenter = wheel.getBoundingClientRect().top + (wheel.clientHeight / 2);
    
    let closestItem = null;
    let closestDist = Infinity;
    
    items.forEach(item => {
        const rect = item.getBoundingClientRect();
        if(rect.height === 0) return; 
        const itemCenter = rect.top + (rect.height / 2);
        const dist = Math.abs(wheelCenter - itemCenter);
        
        if (dist < closestDist) {
            closestDist = dist;
            closestItem = item;
        }
        item.classList.remove('active');
    });
    
    if (closestItem) {
        closestItem.classList.add('active');
        
        if (!preventRender) {
            clearTimeout(scrollTimeouts[type]);
            scrollTimeouts[type] = setTimeout(() => {
                const origIdx = closestItem.getAttribute('data-orig-idx');
                if (type === 'pran') {
                    const input = document.getElementById(`input-${type}`);
                    if (document.activeElement !== input) input.value = sourceData[origIdx].title;
                } else {
                    renderMediaHTML(type, sourceData[origIdx]);
                    const input = document.getElementById(`input-${type}`);
                    if (document.activeElement !== input) input.value = sourceData[origIdx].title;
                }
            }, 300);
        }
    }
}

function selectFromWheel(type, origIdx) {
    const sourceData = type === 'pran' ? APP_CONFIG.pranayamas : APP_CONFIG.meditations;
    const title = sourceData[origIdx].title;
    document.getElementById(`input-${type}`).value = title;
    
    if (type === 'pran') {
        document.getElementById('pran-timer-container').style.display = 'none';
        document.getElementById('display-pran').style.display = 'block';
    }
    
    renderMediaHTML(type, sourceData[origIdx]);
    collapsePicker(type);
}

let currentCardAudio = new Audio();

function toggleCardAudio(src) {
    let btnIcon = document.getElementById('card-audio-icon');
    
    if (currentCardAudio.src && currentCardAudio.src.includes(src) && !currentCardAudio.paused) {
        currentCardAudio.pause();
        btnIcon.setAttribute('data-feather', 'play');
    } else {
        if (!currentCardAudio.src || !currentCardAudio.src.includes(src)) {
            currentCardAudio.src = src;
        }
        currentCardAudio.play().catch(e => console.log(e));
        btnIcon.setAttribute('data-feather', 'pause');
    }
    feather.replace();

    currentCardAudio.ontimeupdate = () => {
        let rem = currentCardAudio.duration - currentCardAudio.currentTime;
        if(isNaN(rem)) return;
        let m = Math.floor(rem / 60);
        let s = Math.floor(rem % 60);
        const display = document.getElementById('card-audio-time');
        if(display) display.innerText = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')} remaining`;
    };
    
    currentCardAudio.onended = () => {
        btnIcon.setAttribute('data-feather', 'play');
        feather.replace();
    };
}

function renderMediaHTML(type, data) {
    const display = document.getElementById(`display-${type}`);
    if (type === 'pran') {
        display.innerHTML = `
            <div class="card">
                <div class="video-box"><iframe src="${data.video}" allowfullscreen></iframe></div>
                <div class="card-body"><h3 class="serif" style="color: var(--gold); margin-bottom: 0;">${data.title}</h3></div>
            </div>
        `;
    } else if (type === 'med') {
        document.getElementById('med-timer-container').style.display = 'none';
        display.style.display = 'block';
        if(currentCardAudio) currentCardAudio.pause(); 
        
        display.innerHTML = `
            <div class="card">
                <img src="${data.img}" loading="lazy" style="width:100%; height:180px; object-fit:cover;">
                <div class="card-body" style="padding-top: 20px;">
                    <h3 class="serif" style="color: var(--gold); margin-bottom: 25px;">${data.title}</h3>
                    
                    <div style="display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 10px;">
                        <button onclick="toggleCardAudio('${data.audio}')" style="background: linear-gradient(135deg, var(--gold), #d97706); border: none; color: var(--bg); border-radius: 50%; width: 65px; height: 65px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(251, 191, 36, 0.4);">
                            <i data-feather="play" id="card-audio-icon" style="width: 26px; height: 26px; margin-left: 3px;"></i>
                        </button>
                        <span id="card-audio-time" style="font-size: 20px; font-weight: bold; color: white; font-family: 'Inter', monospace; opacity: 0.9;">--:-- remaining</span>
                    </div>
                </div>
            </div>
        `;
        feather.replace();
    }
}

function initJitsi() {
    if (typeof JitsiMeetExternalAPI !== 'undefined') {
        new JitsiMeetExternalAPI("8x8.vc", {
            roomName: "vpaas-magic-cookie-47ba1aabdd84458d9977951213e7d9f0/SampleAppIronicPotentialsChainSeemingly",

        });

}

let yajnaSynth = window.speechSynthesis;
let yajnaUtterance = null;

async function openYajnaOverlay() {
    const overlay = document.getElementById('yajna-overlay');
    const content = document.getElementById('yajna-content');
    overlay.classList.add('active');
    
    try {
        const res = await fetch('./assets/what_is_yajna.txt');
        if (res.ok) {
            const text = await res.text();
            content.innerHTML = text.replace(/\n/g, '<br>');
            
            if(yajnaSynth.speaking) yajnaSynth.cancel();
            yajnaUtterance = new SpeechSynthesisUtterance(text);
            
            const voices = yajnaSynth.getVoices();
            let indianVoice = voices.find(v => v.lang === 'en-IN' && (v.name.includes('Female') || v.name.includes('Rishi') || v.name.includes('Veena')));
            if(!indianVoice) indianVoice = voices.find(v => v.lang === 'en-IN'); 
            if(indianVoice) yajnaUtterance.voice = indianVoice;
            
            yajnaUtterance.onend = () => {
                document.getElementById('yajna-audio-icon').setAttribute('data-feather', 'play');
                feather.replace();
            };
        } else {
            content.innerHTML = "Wisdom text could not be loaded.";
        }
    } catch(e) {
        content.innerHTML = "Error loading wisdom.";
    }
}

function closeYajnaOverlay() {
    document.getElementById('yajna-overlay').classList.remove('active');
    if(yajnaSynth.speaking) yajnaSynth.cancel();
    document.getElementById('yajna-audio-icon').setAttribute('data-feather', 'play');
    feather.replace();
}

function toggleYajnaAudio() {
    if(!yajnaUtterance) return;
    const icon = document.getElementById('yajna-audio-icon');
    
    if (yajnaSynth.speaking) {
        if (yajnaSynth.paused) {
            yajnaSynth.resume();
            icon.setAttribute('data-feather', 'pause');
        } else {
            yajnaSynth.pause();
            icon.setAttribute('data-feather', 'play');
        }
    } else {
        yajnaSynth.speak(yajnaUtterance);
        icon.setAttribute('data-feather', 'pause');
    }
    feather.replace();
}

function preloadNearby() {
    let next = pIdx + 1;
    if (next > 109) next = 1;
    let img = new Image();
    img.src = `./parayana/Slide${next}.webp`;
}

function navSlide(dir){ 
    pIdx+=dir; if(pIdx>109) pIdx=1; if(pIdx<1) pIdx=109; 
    document.getElementById('sadhana-slide').src=`./parayana/Slide${pIdx}.webp`; 
    preloadNearby();
}

function handleKeys(e) {
    if (e.key === "ArrowRight") navSlide(1);
    if (e.key === "ArrowLeft") navSlide(-1);
    if (e.altKey && e.key === "Enter") toggleFS();
}

function toggleFS(){ 
    const el = document.getElementById('sadhana-container'); 
    if(!document.fullscreenElement) { el.requestFullscreen().catch(()=>{}); } 
    else { document.exitFullscreen(); }
}

document.addEventListener('fullscreenchange', () => {
    const icon = document.getElementById('fs-icon');
    if (icon) {
        if (document.fullscreenElement && document.fullscreenElement.id === 'sadhana-container') icon.setAttribute('data-feather', 'minimize');
        else icon.setAttribute('data-feather', 'maximize');
    }
    feather.replace();
});

document.getElementById('main-nav').addEventListener('wheel', (evt) => {
    evt.preventDefault();
    document.getElementById('main-nav').scrollLeft += evt.deltaY;
});

if('serviceWorker'in navigator){ navigator.serviceWorker.register('sw.js'); }

window.onload = async () => { 
    await loadConfig(); 
    const flowAudio = document.getElementById('sadhana-bg-audio');
    if (flowAudio) flowAudio.src = "./meditations/vss.mp3";
};
