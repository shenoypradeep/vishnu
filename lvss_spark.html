<!DOCTYPE html>
<html>
<head>
    <title>VSS Firebase Migrator</title>
    <!-- Firebase Compat SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body style="font-family: sans-serif; padding: 20px;">
    <h2>Migrate Excel (CSV) to Firebase</h2>
    <input type="file" id="csvFileInput" accept=".csv" />
    <button onclick="processCSV()">Upload to Database</button>
    <div id="output" style="margin-top: 20px; color: green;"></div>

    <script>
        // Use your live credentials
        firebase.initializeApp({
            apiKey: "AIzaSyDNODSDmwHVfqt2CSb0tPDZwJGYjov7Lt0",
            authDomain: "vedic-space.firebaseapp.com",
            projectId: "vedic-space"
        });
        const db = firebase.firestore();

        function processCSV() {
            const file = document.getElementById("csvFileInput").files[0];
            if (!file) { alert("Please select a CSV file first!"); return; }

            document.getElementById("output").innerText = "Processing...";
            const reader = new FileReader();

            reader.onload = async function(e) {
                const text = e.target.result;
                const rows = text.split("\n");
                
                // Assuming columns: Shloka_ID, Timestamp, User_ID, Name, Shloka_num, Audio_Link, MIME_Type, Feedback, FbAudio
                for (let i = 1; i < rows.length; i++) {
                    const row = rows[i].split(",");
                    if (row.length < 5) continue; // Skip empty rows

                    const shlokaId = row[0].trim();
                    if(!shlokaId) continue;

                    // Parse timestamp back to numbers if needed
                    const timestamp = new Date(row[1]).getTime();

                    try {
                        await db.collection("shloka_logs").doc(shlokaId).set({
                            Shloka_ID: shlokaId,
                            Timestamp: timestamp || new Date().getTime(),
                            User_ID: row[2].trim(),
                            Name: row[3].trim(),
                            Shloka_num: row[4].trim(),
                            Audio_Link: row[5] ? row[5].trim() : "",
                            MIME_Type: row[6] ? row[6].trim() : "audio/webm",
                            Teacher_Feedback_Text: row[7] ? row[7].trim() : "",
                            Teacher_Audio_Link: row[8] ? row[8].trim() : ""
                        });
                        console.log("Uploaded: " + shlokaId);
                    } catch(err) {
                        console.error("Failed on " + shlokaId, err);
                    }
                }
                document.getElementById("output").innerText = "Migration Complete! All records are now in Firestore.";
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
