<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="learnvss_manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="../assets/logo.webp">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Test Login | Learn VSS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        :root { --bg: #1e3a8a; --gold: #fbbf24; --glass: rgba(255, 255, 255, 0.08); --border: rgba(255, 255, 255, 0.12); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { background-color: #0f172a; min-height: 100vh; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #0f172a, #1e3a8a); background-attachment: fixed; min-height: 100vh; color: white; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-card { background: var(--glass); border: 1px solid var(--border); border-radius: 20px; padding: 40px 30px; width: 100%; max-width: 400px; text-align: center; backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); box-shadow: 0 25px 60px -15px rgba(0,0,0,0.5); animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .logo-img { width: 80px; height: auto; margin-bottom: 15px; }
        .title { font-family: 'Playfair Display', serif; color: var(--gold); font-size: 1.8rem; margin-bottom: 5px; }
        .subtitle { font-size: 13px; color: rgba(255,255,255,0.7); margin-bottom: 30px; }
        .input-group { margin-bottom: 15px; position: relative; }
        .input-group i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--gold); width: 18px; }
        input { width: 100%; background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 12px; padding: 14px 15px 14px 45px; color: white; font-size: 14px; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--gold); background: rgba(0,0,0,0.4); }
        input::placeholder { color: rgba(255,255,255,0.4); }
        .btn { width: 100%; background: linear-gradient(135deg, var(--gold), #d97706); border: none; color: #0f172a; padding: 14px; border-radius: 12px; font-weight: bold; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; box-shadow: 0 4px 15px rgba(251, 191, 36, 0.3); font-family: 'Inter', sans-serif; margin-bottom: 15px;}
        .btn-google { background: white; color: #333; box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1); }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .guest-link { margin-top: 15px; font-size: 13px; color: rgba(255,255,255,0.6); cursor: pointer; display: inline-block; transition: 0.2s; }
        .guest-link:hover { color: var(--gold); text-decoration: underline; }
        .error-msg { color: #ff4757; font-size: 12px; margin-bottom: 15px; min-height: 15px; }
        .divider { display: flex; align-items: center; text-align: center; color: rgba(255,255,255,0.3); font-size: 12px; margin: 20px 0; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .divider:not(:empty)::before { margin-right: .5em; }
        .divider:not(:empty)::after { margin-left: .5em; }
        .mode-switch { font-size: 13px; color: rgba(255,255,255,0.6); margin-top: 10px; }
        .mode-switch a { color: var(--gold); cursor: pointer; text-decoration: none; font-weight: 600; }
        .mode-switch a:hover { text-decoration: underline; }
        
        .signup-field { display: none; }
        .serif { font-family: 'Playfair Display', serif; }

        /* Approval Modal CSS */
        .approval-popup { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9); background: rgba(15, 23, 42, 0.95); border: 1px solid var(--gold); border-radius: 20px; padding: 30px 20px; width: 90%; max-width: 350px; text-align: center; z-index: 2147483647; backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); box-shadow: 0 20px 50px rgba(0,0,0,0.8); opacity: 0; pointer-events: none; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .approval-popup.active { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
        .popup-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); z-index: 2147483646; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); }
        .popup-overlay.active { opacity: 1; pointer-events: auto; }
    </style>
</head>
<body>

<div class="login-card">
    <img src="../assets/logo.webp" alt="Vedic Space" class="logo-img">
    <h1 class="title">Vedic Space</h1>
    <p class="subtitle">Access your Test Sādhanā dashboard</p>

    <div class="error-msg" id="error-msg"></div>

    <button class="btn btn-google" id="google-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.16v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.16C1.43 8.55 1 10.22 1 12s.43 3.45 1.16 4.93l3.68-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.16 7.07l3.68 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        Continue with Google
    </button>

    <div class="divider">OR</div>

    <div class="input-group signup-field">
        <i data-feather="user"></i>
        <input type="text" id="firstName" placeholder="First Name">
    </div>

    <div class="input-group signup-field">
        <i data-feather="user"></i>
        <input type="text" id="lastName" placeholder="Last Name">
    </div>

    <div class="input-group">
        <i data-feather="at-sign"></i>
        <input type="text" id="userId" placeholder="Email or User_ID">
    </div>

    <div class="input-group">
        <i data-feather="lock"></i>
        <input type="password" id="password" placeholder="Password">
    </div>

    <button class="btn" id="login-btn"><i data-feather="log-in" style="width: 16px;"></i> Login</button>
    <button class="btn" id="signup-btn" style="display: none;"><i data-feather="user-plus" style="width: 16px;"></i> Create Account</button>

    <div class="mode-switch" id="mode-text">
        Don't have an account? <a onclick="toggleMode()">Sign up here</a>
    </div>

    <span class="guest-link" onclick="continueAsGuest()">Continue as Guest ></span>
</div>

<div class="popup-overlay" id="approval-overlay" onclick="closeApprovalPopup()"></div>
<div class="approval-popup" id="approval-popup">
    <i data-feather="clock" style="color: var(--gold); width: 32px; height: 32px; margin-bottom: 15px;"></i>
    <h3 class="serif" style="color: var(--gold); margin-bottom: 10px; font-size: 1.3rem;">Approval Pending</h3>
    <p id="approval-msg-text" style="font-size: 14px; opacity: 0.9; margin-bottom: 25px; line-height: 1.5; color: white;"></p>
    <button onclick="closeApprovalPopup()" style="width: 100%; background: linear-gradient(135deg, var(--gold), #d97706); color: var(--bg); padding: 12px; border-radius: 12px; font-weight: bold; border: none; font-size: 14px; cursor: pointer; font-family: 'Inter', sans-serif;">Understood</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

    // =============== PASTE YOUR TEST GOOGLE APPS SCRIPT URL HERE ===============
    const GOOGLE_APP_URL = "https://script.google.com/macros/s/AKfycbyRMmFeftM55MPBtPR3dMknnO05SlV2sXbV-thjweCdgzkv5HxTXaBOLawZtJBQQOR2VA/exec";

    const firebaseConfig = {
        apiKey: "AIzaSyDNODSDmwHVfqt2CSb0tPDZwJGYjov7Lt0",
        authDomain: "vedic-space.firebaseapp.com",
        projectId: "vedic-space",
        storageBucket: "vedic-space.firebasestorage.app",
        messagingSenderId: "305492860613",
        appId: "1:305492860613:web:701d9c3ab0cd4c5a3edaac"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    
    const err = document.getElementById('error-msg');
    const loginBtn = document.getElementById('login-btn');
    const signupBtn = document.getElementById('signup-btn');
    feather.replace();

    // Show Pending Popup
    function showPendingModal(msg) {
        document.getElementById('approval-msg-text').innerText = msg;
        document.getElementById('approval-overlay').classList.add('active');
        document.getElementById('approval-popup').classList.add('active');
        err.innerText = "";
    }

    // Expose close function to window
    window.closeApprovalPopup = () => {
        document.getElementById('approval-overlay').classList.remove('active');
        document.getElementById('approval-popup').classList.remove('active');
    };

    // 1. Google Sign In
    document.getElementById('google-btn').onclick = async () => {
        try {
            err.innerText = "Connecting to Google...";
            err.style.color = "var(--gold)";
            const result = await signInWithPopup(auth, provider);
            
            err.innerText = "Checking Approval Status...";
            const googleName = result.user.displayName || result.user.email.split('@')[0];

            const response = await fetch(GOOGLE_APP_URL, {
                method: 'POST',
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ action: "GET_ROLE_AND_LOG", userId: result.user.email, name: googleName }),
            });
            const data = await response.json();

            if(data.status === "success") {
                localStorage.setItem('vss_user_id', result.user.email); 
                localStorage.setItem('vss_user_name', data.name || googleName);
                localStorage.setItem('vss_user_role', data.role || "learner"); 
                window.location.href = "lvss2.html";
            } else if (data.status === "pending") {
                await signOut(auth); // Sign them out of Firebase so they aren't stuck halfway
                showPendingModal(data.message);
            } else {
                throw new Error(data.message);
            }
        } catch (error) { 
            err.style.color = "#ff4757";
            err.innerText = error.message.replace("Firebase: ", ""); 
        }
    };

    // 2. Custom AdHoc Sign-in & Signup
    async function handleAdHocAuth(action) {
        const userIdInput = document.getElementById('userId').value.trim();
        const pass = document.getElementById('password').value.trim();
        let fullName = "";
        
        if(!userIdInput || !pass) {
            err.style.color = "#ff4757";
            err.innerText = "Please enter an Email or User_ID and password.";
            return;
        }

        if (action === "SIGNUP") {
            const fName = document.getElementById('firstName').value.trim();
            const lName = document.getElementById('lastName').value.trim();
            
            if(!fName || !lName) {
                err.style.color = "#ff4757";
                err.innerText = "Please provide your First and Last Name.";
                return;
            }
            fullName = fName + " " + lName;
        }

        err.innerText = "Processing...";
        err.style.color = "var(--gold)";
        loginBtn.disabled = true; signupBtn.disabled = true;

        try {
            const response = await fetch(GOOGLE_APP_URL, {
                method: 'POST',
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ action: action, userId: userIdInput, password: pass, name: fullName }),
            });
            
            const data = await response.json();

            if(data.status === "success") {
                localStorage.setItem('vss_user_id', userIdInput);
                localStorage.setItem('vss_user_name', data.name || userIdInput);
                localStorage.setItem('vss_user_role', data.role || "learner");
                window.location.href = "lvss2.html";
            } else if (data.status === "pending") {
                showPendingModal(data.message);
            } else {
                throw new Error(data.message);
            }
        } catch (e) {
            err.style.color = "#ff4757";
            err.innerText = e.message || "Connection failed. Try again.";
        } finally {
            loginBtn.disabled = false; signupBtn.disabled = false;
        }
    }

    loginBtn.onclick = () => handleAdHocAuth("LOGIN");
    signupBtn.onclick = () => handleAdHocAuth("SIGNUP");

    // 3. Guest Logic
    window.continueAsGuest = () => {
        localStorage.setItem('vss_user_id', 'guest_user');
        localStorage.setItem('vss_user_name', 'Guest User');
        localStorage.setItem('vss_user_role', 'guest');
        window.location.href = "lvss2.html";
    };

    // 4. UI Toggles
    let isLogin = true;
    window.toggleMode = () => {
        isLogin = !isLogin;
        err.innerText = "";
        
        document.getElementById('login-btn').style.display = isLogin ? 'flex' : 'none';
        document.getElementById('signup-btn').style.display = isLogin ? 'none' : 'flex';
        
        const signupFields = document.querySelectorAll('.signup-field');
        signupFields.forEach(field => {
            field.style.display = isLogin ? 'none' : 'block';
        });

        document.getElementById('mode-text').innerHTML = isLogin ? 
            `Don't have an account? <a onclick="toggleMode()">Sign up here</a>` : 
            `Already have an account? <a onclick="toggleMode()">Login here</a>`;
    };
</script>

</body>
</html>
