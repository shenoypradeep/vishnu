<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="learnvss_manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="../assets/logo.webp">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login | Learn VSS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        :root { --gold: #fbbf24; --glass: rgba(255, 255, 255, 0.08); --border: rgba(255, 255, 255, 0.12); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            color: white; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid var(--border);
            border-radius: 24px; padding: 40px 30px; width: 90%; max-width: 400px; text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); animation: fadeUp 0.6s ease-out;
        }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .logo { width: 80px; margin-bottom: 15px; filter: drop-shadow(0 0 10px rgba(251, 191, 36, 0.3)); }
        h2 { font-family: 'Playfair Display', serif; color: var(--gold); font-size: 28px; margin-bottom: 8px; }
        p { font-size: 13px; color: rgba(255,255,255,0.6); margin-bottom: 30px; line-height: 1.5;}

        .input-group { position: relative; margin-bottom: 15px; }
        .input-group i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--gold); width: 18px; }
        .input-group input { 
            width: 100%; background: var(--glass); border: 1px solid var(--border); border-radius: 12px;
            padding: 14px 15px 14px 45px; color: white; outline: none; font-size: 14px; transition: 0.3s;
        }
        .input-group input:focus { border-color: var(--gold); background: rgba(255, 255, 255, 0.1); }
        
        .btn { 
            width: 100%; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s; border: none; display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-primary { background: linear-gradient(135deg, var(--gold), #d97706); color: #0f172a; margin-top: 10px; }
        .btn-primary:hover { box-shadow: 0 4px 15px rgba(251, 191, 36, 0.4); transform: translateY(-2px); }
        
        .divider { display: flex; align-items: center; text-align: center; margin: 25px 0; color: rgba(255,255,255,0.4); font-size: 12px; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .divider:not(:empty)::before { margin-right: 15px; }
        .divider:not(:empty)::after { margin-left: 15px; }

        .btn-google { background: white; color: #333; }
        .btn-google:hover { box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2); transform: translateY(-2px); }
        
        .switch-mode { margin-top: 20px; font-size: 12px; color: rgba(255,255,255,0.6); }
        .switch-mode a { color: var(--gold); text-decoration: none; font-weight: bold; cursor: pointer; }
        
        .error { color: #ff4757; font-size: 12px; margin-top: 15px; min-height: 15px; }
        
        #guest-btn { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: white; margin-top: 15px; }
    </style>
</head>
<body>

<div class="login-card">
    <img src="../assets/logo.webp" alt="Vedic Space" class="logo">
    <h2>Welcome</h2>
    <p>Sign in to sync your progress and join the Sangha.</p>

    <button class="btn btn-google" id="google-btn">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Continue with Google
    </button>

    <div class="divider">OR</div>

    <div id="email-form">
        <div class="input-group">
            <i data-feather="mail"></i>
            <input type="email" id="email" placeholder="Email Address">
        </div>
        <div class="input-group">
            <i data-feather="lock"></i>
            <input type="password" id="password" placeholder="Password">
        </div>
        <button class="btn btn-primary" id="login-btn">Sign In</button>
        <button class="btn btn-primary" id="signup-btn" style="display:none;">Create Account</button>
        
        <div class="error" id="error-msg"></div>

        <div class="switch-mode" id="mode-text">
            Don't have an account? <a onclick="toggleMode()">Sign up</a>
        </div>
    </div>
    
    <button class="btn" id="guest-btn" onclick="continueAsGuest()">Continue as Guest</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

    // *** REPLACE THIS CONFIG WITH YOUR EXACT FIREBASE CONFIG ***
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY_HERE",
        authDomain: "vedic-space.firebaseapp.com",
        projectId: "vedic-space",
        storageBucket: "vedic-space.firebasestorage.app",
        messagingSenderId: "305492860613",
        appId: "1:305492860613:web:701d9c3ab0cd4c5a3edaac"
    };

    let app, auth, provider;
    const err = document.getElementById('error-msg');

    try {
        app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        provider = new GoogleAuthProvider();
    } catch(e) {
        err.innerText = "Firebase configuration error. Check console.";
        console.error(e);
    }

    // Helper to format redirect and save local variables
    function completeLogin(user) {
        localStorage.setItem('vss_user_id', user.uid);
        localStorage.setItem('vss_user_name', user.displayName || user.email || 'Seeker');
        window.location.href = "learnvss.html"; 
    }

    // Google Login
    document.getElementById('google-btn').onclick = async () => {
        try {
            const result = await signInWithPopup(auth, provider);
            completeLogin(result.user);
        } catch (e) { 
            // Catch domain/popup issues
            err.innerText = e.message.replace("Firebase: ", "");
            console.error(e);
        }
    };

    // Email Login
    document.getElementById('login-btn').onclick = async () => {
        try {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            if(!email || !pass) throw new Error("Please enter email and password.");
            
            const result = await signInWithEmailAndPassword(auth, email, pass);
            completeLogin(result.user);
        } catch (e) { 
            err.innerText = e.message.replace("Firebase: ", ""); 
        }
    };

    // Email Signup
    document.getElementById('signup-btn').onclick = async () => {
        try {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            if(!email || !pass) throw new Error("Please enter email and password.");

            const result = await createUserWithEmailAndPassword(auth, email, pass);
            completeLogin(result.user);
        } catch (e) { 
            err.innerText = e.message.replace("Firebase: ", "");
        }
    };

    // Global context functions
    window.continueAsGuest = () => {
        localStorage.setItem('vss_user_id', 'guest_user');
        localStorage.setItem('vss_user_name', 'Guest User');
        window.location.href = "learnvss.html";
    };

    let isLogin = true;
    window.toggleMode = () => {
        isLogin = !isLogin;
        document.getElementById('login-btn').style.display = isLogin ? 'flex' : 'none';
        document.getElementById('signup-btn').style.display = isLogin ? 'none' : 'flex';
        document.getElementById('mode-text').innerHTML = isLogin ? 
            `Don't have an account? <a onclick="toggleMode()">Sign up</a>` : 
            `Already have an account? <a onclick="toggleMode()">Sign in</a>`;
    };

    feather.replace();
</script>
</body>
</html>
